    pts.push([cx + ux*t2, cy + uy*t2]);
  }
  // Луч берёт САМОЕ ДАЛЬНЕЕ пересечение, поэтому у не-звёздчатой фигуры
  // вогнутости просто заплывают. Сверяем площади: разошлись — значит форму
  // испортили, и лучше вернуться к отсечению ушей.
  const near = (a, b) => Math.abs(Math.abs(a) - Math.abs(b)) <= Math.abs(b)*0.03 + 1e-6;
  if(!near(sArea(pts.slice(0, n)), sArea(outer))) return null;
  if(!near(sArea(pts.slice(n)), sArea(hole))) return null;
  const tris = [];
  for(let i=0;i<n;i++){
    const j = (i+1)%n;
    tris.push([i, j, m+j], [i, m+j, m+i]);
  }
  return {pts, tris};
}
const faceRing = (outer, hole) => annulusFace(outer, hole) || faceTris(outer, [hole]);
function faceParts(outer, holes, out){
  out = out || [];
  const hs = (holes || []).filter(h => h.length > 2);
  // Режем до ОДНОЙ дырки на кусок: на двух-трёх буквах сразу отсечение ушей
  // иногда не доводило грань до конца и оставляло щели.
  if(hs.length <= 1){ out.push(faceTris(outer, hs)); return out; }
  const bb = ringBBox(outer);
  const cx = gapCut(hs.map(h => { const b = ringBBox(h); return [b[0], b[2]]; }));
  if(cx !== null){
    faceParts(rectRing(bb[0], bb[1], cx, bb[3]), hs.filter(h => ringBBox(h)[2] < cx), out);
    faceParts(rectRing(cx, bb[1], bb[2], bb[3]), hs.filter(h => ringBBox(h)[2] >= cx), out);
    return out;
  }
  const cy = gapCut(hs.map(h => { const b = ringBBox(h); return [b[1], b[3]]; }));
  if(cy !== null){
    faceParts(rectRing(bb[0], bb[1], bb[2], cy), hs.filter(h => ringBBox(h)[3] < cy), out);
    faceParts(rectRing(bb[0], cy, bb[2], bb[3]), hs.filter(h => ringBBox(h)[3] >= cy), out);
    return out;
  }
  out.push(faceTris(outer, hs));
  return out;
}
/* Много дырок сразу отсекать ушами дорого: сначала выделяем прямоугольник,
   в котором они все сидят, и режем уже его. */
function facePlan(outer, holes){
  const hs = (holes || []).filter(h => h.length > 2);
  if(hs.length === 1) return [faceRing(outer, hs[0])];
  if(hs.length <= 3) return [faceTris(outer, hs)];
  let bb = [1e9,1e9,-1e9,-1e9];
  for(const h of hs){ const b = ringBBox(h);
    bb[0] = Math.min(bb[0], b[0]); bb[1] = Math.min(bb[1], b[1]);
    bb[2] = Math.max(bb[2], b[2]); bb[3] = Math.max(bb[3], b[3]); }
  const e = 0.02, R = rectRing(bb[0]-e, bb[1]-e, bb[2]+e, bb[3]+e);
  return faceParts(R, hs, [faceRing(outer, R)]);
}

/* ---------- накопитель треугольников ----------
   Ключ покраски держится в одной переменной на время сборки куска, а не
   тащится параметром через все helper'ы: иначе он был бы в подписи каждой
   функции, а меняется он ровно пять раз за сборку. */
let _mk = null;
function meshNew(){ return {p:[], n:[], c:[], k:[]}; }
function meshTri(M, a, b, c, col){
  if(M.xf){ a = M.xf(a); b = M.xf(b); c = M.xf(c); }
  const ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2];
  const vx=c[0]-a[0], vy=c[1]-a[1], vz=c[2]-a[2];
  let nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
  const L = Math.hypot(nx,ny,nz) || 1; nx/=L; ny/=L; nz/=L;
  M.p.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2]);
  for(let i=0;i<3;i++){ M.n.push(nx,ny,nz); M.c.push(col[0],col[1],col[2]); }
  M.k.push(_mk);
}
const meshQuad = (M,a,b,c,d,col) => { meshTri(M,a,b,c,col); meshTri(M,a,c,d,col); };
/* Плоская грань в плоскости xz на высоте y. */
function meshFace(M, parts, y, col){
  for(const pr of parts) for(const t of pr.tris){
    const a = pr.pts[t[0]], b = pr.pts[t[1]], c = pr.pts[t[2]];
    meshTri(M, [a[0],y,a[1]], [b[0],y,b[1]], [c[0],y,c[1]], col);
  }
}
/* Стенка по кольцу между двумя высотами. */
function meshWall(M, ring, y0, y1, col){
  const n = ring.length;
  for(let i=0;i<n;i++){
    const a = ring[i], b = ring[(i+1)%n];
    meshQuad(M, [a[0],y0,a[1]], [b[0],y0,b[1]], [b[0],y1,b[1]], [a[0],y1,a[1]], col);
  }
}
/* Юбка между двумя разными кольцами — фаска. Точек должно быть поровну. */
function meshSkirt(M, r0, y0, r1, y1, col){
  const n = Math.min(r0.length, r1.length);
  for(let i=0;i<n;i++){
    const a = r0[i], b = r0[(i+1)%n], c = r1[(i+1)%n], d = r1[i];
    meshQuad(M, [a[0],y0,a[1]], [b[0],y0,b[1]], [c[0],y1,c[1]], [d[0],y1,d[1]], col);
  }
}
/* Призма вдоль z: профиль задан в плоскости xy. */
function meshPrismZ(M, prof, z0, z1, col){
  const P = ringOrient(ringClean(prof), true), n = P.length;
  for(let i=0;i<n;i++){
    const a = P[i], b = P[(i+1)%n];
    meshQuad(M, [a[0],a[1],z0], [b[0],b[1],z0], [b[0],b[1],z1], [a[0],a[1],z1], col);
  }
  for(const t of earClip(P)){
    const a=P[t[0]], b=P[t[1]], c=P[t[2]];
    meshTri(M, [a[0],a[1],z0], [b[0],b[1],z0], [c[0],c[1],z0], col);
    meshTri(M, [a[0],a[1],z1], [b[0],b[1],z1], [c[0],c[1],z1], col);
  }
}
/* Цилиндр вдоль y — монета и штифт. */
function meshCylY(M, cx, cz, r, y0, y1, seg, col){
  const ring = circlePts(cx, cz, r, seg || 40);
  meshWall(M, ring, y0, y1, col);
  const tr = faceTris(ring, []);
  meshFace(M, [tr], y0, col); meshFace(M, [tr], y1, col);
}
/* ---------- цвета ---------- */
const _hexRGB = h => {
  h = String(h).trim();
  if(h[0] === "#"){
    if(h.length === 4) h = "#" + h[1]+h[1] + h[2]+h[2] + h[3]+h[3];
    return [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255,
            parseInt(h.slice(5,7),16)/255];
  }
  const m = h.match(/rgba?\(([^)]+)\)/);
  if(m){ const a = m[1].split(/[,\s/]+/).map(Number); return [a[0]/255, a[1]/255, a[2]/255]; }
  return [0.75, 0.78, 0.78];
};
let _varRGB = {};
function cssRGB(v){
  if(!v) return [0.75, 0.78, 0.78];
  v = String(v).trim();
  const m = v.match(/^var\(\s*(--[\w-]+)\s*\)$/);
  if(m){
    if(_varRGB[m[1]] === undefined)
      _varRGB[m[1]] = (getComputedStyle(document.documentElement)
                        .getPropertyValue(m[1]) || "").trim();
    v = _varRGB[m[1]] || "#cccccc";
  }
  return _hexRGB(v);
}
const mix = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];


/* ---------- гравировка: контуры букв и иконки ----------
   Контуры шрифта браузер наружу не отдаёт, поэтому строка рисуется в
   невидимый буфер и обводится тем же трассировщиком, что и загруженная
   картинка. Каждая строка отдельно — тогда у неё свой цвет покраски и своя
   маленькая триангуляция. Иконки обводить не нужно: они и так лежат
   многоугольниками. */
function traceInk(draw, x0, y0, x1, y1){
  const px = clamp(1000/Math.max(x1-x0, y1-y0, 0.01), 4, 22);
  const W = Math.max(8, Math.round((x1-x0)*px)), H = Math.max(8, Math.round((y1-y0)*px));
  if(W*H > 4.2e6) return [];
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cx = cv.getContext("2d", {willReadFrequently:true});
  if(!cx) return [];
  cx.clearRect(0, 0, W, H);
  cx.fillStyle = "#000";
  draw(cx, px, x0, y0);
  const img = cx.getImageData(0, 0, W, H).data;
  // За кадром — заведомо фон: контур, дошедший до края, обязан замкнуться.
  const al = (i,j) => (i < 0 || j < 0 || i >= W || j >= H) ? 0 : img[(j*W + i)*4 + 3]/255;
  const fld = (x, y) => {
    const ax = clamp(x, -1, W), ay = clamp(y, -1, H);
    const i0 = Math.floor(ax), j0 = Math.floor(ay), fx = ax-i0, fy = ay-j0;
    return 0.5 - (al(i0,j0)*(1-fx)*(1-fy) + al(i0+1,j0)*fx*(1-fy) +
                  al(i0,j0+1)*(1-fx)*fy   + al(i0+1,j0+1)*fx*fy);
  };
  const out = [];
  for(const r of marchingSquares(fld, {x0:-1, y0:-1, x1:W+1, y1:H+1},
                                 Math.min(Math.max(W,H), 820))){
    const mm = ringClean(r).map(p => [x0 + p[0]/px, y0 + p[1]/px]);
    const sp = rdp(mm, Math.max(0.03, 1/px*0.7));
    if(sp.length > 4 && polyArea(sp) > 0.015) out.push(sp);
  }
  return out;
}
function engraveRings(m){
  const s = state;
  if(!s.text_enable) return [];
  const E = engravePos(m), f = fontDef(s.text_font);
  const em = E.L.size*EM_PER_SIZE, out = [];
  for(let i=0;i<E.n;i++){
    const txt = E.L.lines[i];
    if(!txt) continue;
    const wmm = measure(txt, f.css, f.w, 100)/100*em;
    const cy = E.syText - ((E.n-1)/2 - i)*E.L.pitch;
    const pad = Math.max(0.8, em*0.45);
    const x0 = E.sxText - wmm/2 - pad, x1 = E.sxText + wmm/2 + pad;
    const y0 = cy - em*0.85 - pad,     y1 = cy + em*0.85 + pad;
    const rings = traceInk((cx, px, ox, oy) => {
      cx.textAlign = "center"; cx.textBaseline = "middle";
      cx.font = f.w + " " + (em*px) + "px " + f.css;
      cx.fillText(txt, (E.sxText - ox)*px, (cy - oy)*px);
    }, x0, y0, x1, y1);
    if(rings.length) out.push({key:"line" + (i+1), rings});
  }
  if(s.icon_type > 0){
    const loops = s.icon_type === 99 ? state.custom_icon
                                     : (ICONS[s.icon_type-1] && ICONS[s.icon_type-1].loops);
    const rings = [];
    if(loops) for(const L of loops){
      const r = ringClean(L.map(p => [E.sxIcon + p[0]*s.icon_size,
                                      E.syIcon - p[1]*s.icon_size]));
      if(r.length > 2) rings.push(r);
    }
    if(rings.length) out.push({key:"icon", rings});
  }
  // Из системы гравировки (sx вдоль строки, sy поперёк) — в координаты
  // детали. Разложено по тем же преобразованиям, что в .scad: там надпись
  // строится в плоскости (u, v) = (x, H - z), доворачивается rotate(-90),
  // отражается mirror([0,1,0]) и вся целиком поворачивается на 180° вокруг
  // центра плиты. В сумме это даёт x = p1cx + sy и z = H/2 + sx — то есть
  // строка читается вдоль +Z. Знак у z именно такой: с минусом буквы
  // выходили зеркальными (сверено с рендером настоящего OpenSCAD).
  const toXZ = r => r.map(p => [m.p1x0 + m.W/2 + p[1], m.H/2 + p[0]]);
  for(const it of out) it.rings = it.rings.map(toXZ);
  return out;
}

/* Сечение выреза под палец на заданной глубине. Форма известна точно —
   круг или скруглённый квадрат, — а поджатие внутрь на ins это просто
   меньший радиус. Через марширующие квадраты каждый из тринадцати уровней
   скругления дна стоил около трёх миллисекунд, и пересборка меша упиралась
   именно в них. */
function notchRing(sh, ins, n){
  n = n || 72;
  if(sh.kind !== "rrect"){
    const r = sh.r - ins;
    return r > 0.02 ? circlePts(sh.x, sh.y, r, n) : null;
  }
  const rr = sh.r - ins, e = Math.max(0, -rr), c = Math.max(rr, 0.01);
  const hx = Math.max(sh.w/2 - sh.r, 0) - e, hy = Math.max(sh.h/2 - sh.r, 0) - e;
  if(hx + c <= 0.02 || hy + c <= 0.02) return null;
  const q = Math.max(4, Math.round(n/4)), out = [];
  for(const [cx, cy, a0] of [[hx,hy,0], [-hx,hy,Math.PI/2],
                             [-hx,-hy,Math.PI], [hx,-hy,-Math.PI/2]])
    for(let i=0;i<=q;i++){
      const a = a0 + i/q*Math.PI/2;
      out.push([sh.x + cx + c*Math.cos(a), sh.y + cy + c*Math.sin(a)]);
    }
  return out;
}

/* ---------- половинка целиком ---------- */
function meshHalf(M, m, part, engSet, C){
  const s = state, isLid = part === 1, T = m.T;
  // Фаски не должны съесть боковую стенку: при узкой стенке фаска плиты и
  // фаска кармана встречаются, обод верхней грани вырождается, и кольцевую
  // грань уже не построить. Обе ужимаются до сорока процентов стенки.
  const wall = Math.max(0.05, m.W/2 - m.cav_r);
  const ch = Math.max(0.05, Math.min(0.6, T*0.15, m.corner_r*0.4, m.W*0.02, wall*0.4));
  const put = p => isLid ? [K.tab_len + p[0], p[1]] : [K.wall_x - p[0], p[1]];
  const NR = 128;
  const ringO = resample(ringClean(plateOutline(m.W, m.H, m.corner_r, 22).map(put)), NR);
  const ringI = resample(ringClean(
    plateOutline(m.W - 2*ch, m.H - 2*ch, Math.max(m.corner_r - ch, 0.15), 22)
      .map(p => put([p[0] + ch, p[1] + ch]))), NR);
  const col = isLid ? C.lid : C.base;
  _mk = isLid ? "lid" : "base";

  // боковина с мелкой фаской по обеим кромкам — как chamfered_plate в .scad
  meshSkirt(M, ringI, 0, ringO, ch, col);
  meshWall(M, ringO, ch, T - ch, col);
  meshSkirt(M, ringO, T - ch, ringI, T, col);

  // карман: обод с фаской на входе, прямая стенка, дно
  const cxp = isLid ? m.p1cx : m.p2cx;
  const pd  = Math.min(isLid ? m.lidD : m.baseD, T - 0.05);
  const pch = Math.max(0, Math.min(1.0, pd*0.5, m.cav_r*0.5, wall*0.4));
  const shMid = cavityShapes(m, cxp, m.cz, !isLid);
  const shTop = shMid.map((c,i) => i === 0
    ? {kind:"circle", x:c.x, y:c.y, r:c.r + pch} : c);
  // Разрешение трассировки: 112 хватает — контур всё равно переразбивается
  // на NP точек, а каждая лишняя сотня клеток стоит миллисекунды при
  // перестроении под пальцем.
  const gTop = groupRings(shapePaths(shTop, 112));
  const gMid = groupRings(shapePaths(shMid, 112));
  const NP = 128;
  // Контуры кармана прореживаются до NP точек: трассировка выдаёт их сотнями,
  // почти коллинеарными, и триангуляция на них спотыкается.
  meshFace(M, facePlan(ringI, gTop.map(g => resample(g.outer, NP))), T, col);
  const rT = gTop.length === 1 ? resample(gTop[0].outer, NP) : null;
  const rM = gMid.length === 1 ? resample(gMid[0].outer, NP) : null;
  if(rT && rM && pch > 0.01){
    meshSkirt(M, rT, T, rM, T - pch, col);
    meshWall(M, rM, T - pch, T - pd, col);
  } else for(const g of gTop) meshWall(M, resample(g.outer, NP), T, T - pd, col);

  // вырезы под пальцы уходят ГЛУБЖЕ дна кармана: дно кармана — это
  // объединение минус вырезы, а сами вырезы дальше идут своими ваннами.
  const nd = Math.min(s.finger_notch_depth, T - 0.15);
  const deep = !isLid && s.finger_notch_enable && nd > pd + 0.02 ? shMid.slice(1) : null;
  let floorGroups = gMid;
  if(deep){
    const fA = shapeField(shMid), fN = shapeField(deep);
    const bb = shapeBBox(shMid), pad = Math.max(bb.x1-bb.x0, bb.y1-bb.y0)*0.06 + 0.5;
    floorGroups = groupRings(marchingSquares((x,y) => Math.max(fA(x,y), -fN(x,y)),
      {x0:bb.x0-pad, y0:bb.y0-pad, x1:bb.x1+pad, y1:bb.y1+pad}, 130));
  }
  for(const g of floorGroups)
    meshFace(M, facePlan(resample(g.outer, NP), g.holes.map(h => resample(h, 72))),
      T - pd, col);
  if(deep){
    const f = Math.max(0, Math.min(s.finger_notch_fillet, m.fn_r*0.95, nd*0.95));
    const straight = nd - f, STEPS = f > 0.06 ? 12 : 0;
    const lv = [{w:T - pd, ins:0}, {w:Math.min(T - straight, T - pd), ins:0}];
    for(let k=1;k<=STEPS;k++){
      const a = k*Math.PI/2/STEPS;
      lv.push({w:Math.min(T - straight - f*Math.sin(a), T - pd), ins:f*(1 - Math.cos(a))});
    }
    for(const sh of deep){
      const lr = lv.map(L => notchRing(sh, L.ins, 72));
      for(let i=0;i+1<lr.length;i++)
        if(lr[i] && lr[i+1] && lr[i].length > 3 && lr[i+1].length > 3)
          meshSkirt(M, lr[i], lv[i].w, lr[i+1], lv[i+1].w, col);
      let last = null, lastW = 0;
      for(let i=0;i<lr.length;i++) if(lr[i] && lr[i].length > 3){ last = lr[i]; lastW = lv[i].w; }
      if(last) meshFace(M, [faceTris(last, [])], lastW, col);
    }
  }


  // тыльная грань; у крышки в ней сидит гравировка
  const engGroups = [];
  if(isLid && engSet) for(const it of engSet){
    const gs = groupRings(it.rings);
    if(gs.length) engGroups.push({col:it.col, key:it.key, gs});
  }
  const holes = [];
  for(const e of engGroups) for(const g of e.gs) holes.push(g.outer);
  meshFace(M, facePlan(ringI, holes), 0, col);
  if(engGroups.length){
    const d = Math.max(0.05, Math.min(state.text_depth, T*0.4));
    for(const e of engGroups){ _mk = e.key; for(const g of e.gs){
      meshWall(M, g.outer, 0, d, e.col);
      meshFace(M, facePlan(g.outer, g.holes), d, e.col);
      // «дырка в дырке» — внутренность буквы О: там материал остаётся
      for(const h of g.holes){
        meshWall(M, h, 0, d, e.col);
        meshFace(M, [faceTris(h, [])], 0, col);
      }
    } }
    _mk = isLid ? "lid" : "base";
  }

  // петля. Проушины крышки уезжают вместе с крышкой, поэтому лежат в её меше.
  _mk = null;                       // петля, штифт и монета не красятся
  const R = K.knuckle_r;
  const barrel = (xw, dir) => hull2d(circlePts(K.knuckle_x, T, R, 28).concat(
    [[xw + dir*ch, 0], [xw, ch], [xw, T - ch], [xw + dir*ch, T]]));
  if(isLid){
    const pr = barrel(K.tab_len, +1);
    meshPrismZ(M, pr, 0, m.gapLo, C.brass);
    meshPrismZ(M, pr, m.gapHi, m.H, C.brass);
    // штифт сидит на оси: при закрывании он сам себе соответствует
    meshPrismZ(M, circlePts(K.knuckle_x, T, 1.65, 24), -1.5, m.H + 1.5, C.pin);
    // прилив-защёлка — часть крышки, красится вместе с ней
    _mk = "lid";
    const by = K.boss_y, bh = Math.min(8.3, m.H*0.5), bz = m.H/2 - bh/2;
    meshPrismZ(M, [[m.p1x1 - 2.4, T], [m.p1x1, T], [m.p1x1, T + by], [m.p1x1 - 2.4, T + by],
                   [m.p1x1 - 3.3, T + by*0.811], [m.p1x1 - 2.4, T + by*0.622]],
      bz, bz + bh, col);
  } else {
    meshPrismZ(M, barrel(K.wall_x, -1), m.barLo, m.barHi, C.brass);
    if(s.show_coin){
      const y0 = T - pd;
      meshCylY(M, m.p2cx, m.cz, s.coin_d/2, y0, Math.min(y0 + s.coin_t, T), 56, C.gold);
    }
  }
}

/* ---------- сборка ---------- */
function buildMesh(m, engSet){
  _varRGB = {};
  const C = {
    lid:   cssRGB(colorOf("lid",  "var(--part)")),
    base:  cssRGB(colorOf("base", "var(--part)")),
    brass: cssRGB("var(--brass-soft)"),
    pin:   cssRGB("var(--brass)"),
    gold:  cssRGB("var(--gold)")
  };
  const eng = (engSet || []).map(it => ({
    rings: it.rings, key: it.key,
    col: state.colors && state.colors[it.key]
      ? cssRGB(state.colors[it.key]) : mix(C.lid, [0,0,0], 0.42)
  }));
  const M = meshNew();
  // Закрытый вид — поворот крышки на 180° вокруг оси петли. Преобразование
  // висит на самом меше и применяется при укладке треугольника: собирать
  // половинку отдельно и потом переливать её в общий массив выходило
  // дороже, чем построить.
  if(isoMode === "closed"){
    const kx = K.knuckle_x, T2 = 2*m.T;
    M.xf = p => [2*kx - p[0], T2 - p[1], p[2]];
  }
  meshHalf(M, m, 1, eng, C);
  M.xf = null;
  meshHalf(M, m, 2, null, C);
  return M;
}

/* ---------- вывод на экран ----------
   Свой маленький WebGL вместо готовой библиотеки: тут нужен один шейдер,
   вращение мышью и плоское затенение, а лишние мегабайты в страницу тянуть
   незачем — она и так весит немало из-за движка OpenSCAD. */
const D3 = {
  cv:null, gl:null, prog:null, loc:null, buf:null, count:0,
  yaw:-42, pitch:26, zoom:1, ctr:[0,0,0], rad:60,
  eng:null, engKey:null, timer:0, meshKey:null, drag:null, failed:false
};
const D3_VS = [
  "attribute vec3 aPos; attribute vec3 aNor; attribute vec3 aCol;",
  "uniform mat4 uMVP; uniform mat3 uNM;",
  "varying vec3 vN; varying vec3 vC;",
  "void main(){ vN = uNM*aNor; vC = aCol; gl_Position = uMVP*vec4(aPos,1.0); }"
].join("\n");
const D3_FS = [
  "precision mediump float;",
  "varying vec3 vN; varying vec3 vC;",
  "void main(){",
  "  vec3 n = normalize(vN);",
  "  if(!gl_FrontFacing) n = -n;",
  "  vec3 L = normalize(vec3(-0.34, 0.52, 0.78));",
  "  float d = max(dot(n, L), 0.0);",
  "  float b = 0.34 + 0.60*d;",
  "  float sp = pow(max(dot(reflect(-L, n), vec3(0.0,0.0,1.0)), 0.0), 26.0)*0.16;",
  "  gl_FragColor = vec4(vC*b + sp, 1.0);",
  "}"
].join("\n");

const v3n = a => { const L = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/L,a[1]/L,a[2]/L]; };
const v3c = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const v3d = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
function m4mul(a, b){
  const o = new Float32Array(16);
  for(let c=0;c<4;c++) for(let r=0;r<4;r++){
    let s = 0; for(let k=0;k<4;k++) s += a[k*4+r]*b[c*4+k];
    o[c*4+r] = s;
  }
  return o;
}
function m4persp(fovy, asp, n, f){
  const t = 1/Math.tan(fovy/2), o = new Float32Array(16);
  o[0] = t/asp; o[5] = t; o[10] = (f+n)/(n-f); o[11] = -1; o[14] = 2*f*n/(n-f);
  return o;
}
function m4look(eye, at, up){
  const z = v3n([eye[0]-at[0], eye[1]-at[1], eye[2]-at[2]]);
  const x = v3n(v3c(up, z)), y = v3c(z, x);
  const o = new Float32Array(16);
  o[0]=x[0]; o[4]=x[1]; o[8]=x[2];  o[12]=-v3d(x,eye);
  o[1]=y[0]; o[5]=y[1]; o[9]=y[2];  o[13]=-v3d(y,eye);
  o[2]=z[0]; o[6]=z[1]; o[10]=z[2]; o[14]=-v3d(z,eye);
  o[15]=1;
  return o;
}
function d3Init(){
  if(D3.gl || D3.failed) return !!D3.gl;
  const cv = document.getElementById("gl3");
  if(!cv){ D3.failed = true; return false; }
  const gl = cv.getContext("webgl", {antialias:true, alpha:true, premultipliedAlpha:false})
          || cv.getContext("experimental-webgl", {antialias:true});
  if(!gl){ D3.failed = true; return false; }
  const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s; };
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, D3_VS));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, D3_FS));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch(e){ D3.failed = true; return false; }
  D3.cv = cv; D3.gl = gl; D3.prog = prog;
  D3.loc = {
    aPos: gl.getAttribLocation(prog, "aPos"),
    aNor: gl.getAttribLocation(prog, "aNor"),
    aCol: gl.getAttribLocation(prog, "aCol"),
    uMVP: gl.getUniformLocation(prog, "uMVP"),
    uNM:  gl.getUniformLocation(prog, "uNM")
  };
  D3.buf = {p:gl.createBuffer(), n:gl.createBuffer(), c:gl.createBuffer()};
  gl.enable(gl.DEPTH_TEST);
  d3Bind(cv);
  return true;
}
/* Вращение — перетаскиванием, приближение — колесом. Двойной щелчок
   возвращает исходный ракурс. */
function d3Bind(cv){
  cv.addEventListener("pointerdown", ev => {
    cv.setPointerCapture(ev.pointerId);
    D3.drag = {x:ev.clientX, y:ev.clientY, yaw:D3.yaw, pitch:D3.pitch, moved:0};
    ev.preventDefault();
  });
  cv.addEventListener("pointermove", ev => {
    if(!D3.drag) return;
    D3.drag.moved = Math.max(D3.drag.moved,
      Math.abs(ev.clientX - D3.drag.x) + Math.abs(ev.clientY - D3.drag.y));
    D3.yaw = D3.drag.yaw + (ev.clientX - D3.drag.x)*0.42;
    D3.pitch = clamp(D3.drag.pitch + (ev.clientY - D3.drag.y)*0.35, -88, 88);
    d3Draw();
  });
  const stop = ev => {
    if(!D3.drag) return;
    const click = D3.drag.moved < 4;
    D3.drag = null;
    try{ cv.releasePointerCapture(ev.pointerId); }catch(e){}
    if(click && brush) d3Paint(ev);
  };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  cv.addEventListener("wheel", ev => {
    ev.preventDefault();
    D3.zoom = clamp(D3.zoom * Math.exp(-ev.deltaY*0.0013), 0.35, 6);
    d3Draw();
  }, {passive:false});
  cv.addEventListener("dblclick", () => {
    D3.yaw = -42; D3.pitch = 26; D3.zoom = 1; d3Draw();
  });
}
/* Щелчок кистью по модели. Луч из глаза через пиксель ищется по всем
   треугольникам: их около десяти тысяч, перебор занимает миллисекунды и
   случается только по клику — городить буфер идентификаторов незачем. */
function d3Paint(ev){
  const cv = D3.cv, B = D3.basis;
  if(!cv || !B || !D3.pos) return;
  const r = cv.getBoundingClientRect();
  const nx = (ev.clientX - r.left)/r.width*2 - 1;
  const ny = 1 - (ev.clientY - r.top)/r.height*2;
  const ty = Math.tan(B.fov/2), tx = ty*B.asp;
  const d = v3n([-B.dir[0] + B.right[0]*nx*tx + B.up[0]*ny*ty,
                 -B.dir[1] + B.right[1]*nx*tx + B.up[1]*ny*ty,
                 -B.dir[2] + B.right[2]*nx*tx + B.up[2]*ny*ty]);
  const o = D3.eye, P = D3.pos;
  let best = Infinity, key = undefined;
  for(let i=0, t=0; i<P.length; i+=9, t++){
    // Петля и монета в переборе участвуют: если ближе всего оказалась они,
    // красить нечего — иначе кисть доставала бы грань за ними.
    const e1 = [P[i+3]-P[i], P[i+4]-P[i+1], P[i+5]-P[i+2]];
    const e2 = [P[i+6]-P[i], P[i+7]-P[i+1], P[i+8]-P[i+2]];
    const pv = v3c(d, e2), det = v3d(e1, pv);
    if(Math.abs(det) < 1e-9) continue;
    const inv = 1/det, tv = [o[0]-P[i], o[1]-P[i+1], o[2]-P[i+2]];
    const u = v3d(tv, pv)*inv; if(u < 0 || u > 1) continue;
    const qv = v3c(tv, e1), vv = v3d(d, qv)*inv;
    if(vv < 0 || u + vv > 1) continue;
    const dist = v3d(e2, qv)*inv;
    if(dist > 1e-4 && dist < best){ best = dist; key = D3.keys[t]; }
  }
  if(key === undefined || key === null) return;
  pushUndo();
  if(!state.colors) state.colors = {};
  if(brush === "erase") delete state.colors[key];
  else state.colors[key] = brush;
  render();
}
function d3Upload(M){
  const gl = D3.gl; if(!gl) return;
  const set = (b, arr, n) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
  };
  set(D3.buf.p, M.p); set(D3.buf.n, M.n); set(D3.buf.c, M.c);
  D3.count = M.p.length/3;
  let x0=1e9,y0=1e9,z0=1e9,x1=-1e9,y1=-1e9,z1=-1e9;
  for(let i=0;i<M.p.length;i+=3){
    if(M.p[i]<x0)x0=M.p[i];     if(M.p[i]>x1)x1=M.p[i];
    if(M.p[i+1]<y0)y0=M.p[i+1]; if(M.p[i+1]>y1)y1=M.p[i+1];
    if(M.p[i+2]<z0)z0=M.p[i+2]; if(M.p[i+2]>z1)z1=M.p[i+2];
  }
  if(x1 < x0){ x0=y0=z0=-1; x1=y1=z1=1; }
  D3.ctr = [(x0+x1)/2, (y0+y1)/2, (z0+z1)/2];
  D3.rad = Math.max(Math.hypot(x1-x0, y1-y0, z1-z0)/2, 1);
  D3.box = [x0,y0,z0,x1,y1,z1];
  D3.pos = M.p; D3.keys = M.k;
}
/* Кадрируем по настоящим габаритам, а не по описанной сфере: деталь плоская,
   сфера вокруг неё вдвое больше силуэта, и модель висела бы в углу окна. */
function d3Fit(right, up, fwd, fovY, asp){
  const B = D3.box; if(!B) return D3.rad*4;
  // Условие «угол виден» решается точно: глубина угла плюс его отступ от оси,
  // делённый на тангенс. Прикидка «радиус плюс полглубины» отодвигала камеру
  // дальше нужного, и деталь висела в окне маленькой.
  const ty = Math.tan(fovY/2), tx = ty*asp;
  let dist = 0;
  for(let i=0;i<8;i++){
    const p = [B[(i&1)?3:0] - D3.ctr[0], B[(i&2)?4:1] - D3.ctr[1], B[(i&4)?5:2] - D3.ctr[2]];
    const need = v3d(p, fwd) +
      Math.max(Math.abs(v3d(p, up))/ty, Math.abs(v3d(p, right))/tx)*1.06;
    if(need > dist) dist = need;
  }
  return Math.max(dist, D3.rad*0.6);
}
function d3Draw(){
  const gl = D3.gl, cv = D3.cv;
  if(!gl || !cv || !D3.count) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(cv.clientWidth*dpr));
  const h = Math.max(2, Math.round(cv.clientHeight*dpr));
  if(cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  const bg = cssRGB("var(--panel-2)");
  gl.clearColor(bg[0], bg[1], bg[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const fov = 26*Math.PI/180;
  const a = D3.yaw*Math.PI/180, b = D3.pitch*Math.PI/180;
  const dir = [Math.cos(b)*Math.sin(a), Math.sin(b), Math.cos(b)*Math.cos(a)];
  const right = v3n(v3c([0,1,0], dir)), up = v3c(dir, right);
  const dist = d3Fit(right, up, dir, fov, w/h)/D3.zoom;
  D3.eye = [D3.ctr[0] + dist*dir[0], D3.ctr[1] + dist*dir[1], D3.ctr[2] + dist*dir[2]];
  D3.basis = {right, up, dir, fov, asp:w/h};
  const eye = D3.eye;
  const V = m4look(eye, D3.ctr, [0,1,0]);
  const P = m4persp(fov, w/h, Math.max(dist - D3.rad*1.6, D3.rad*0.02), dist + D3.rad*2.5);
  const MVP = m4mul(P, V);
  const NM = new Float32Array([V[0],V[1],V[2], V[4],V[5],V[6], V[8],V[9],V[10]]);

  gl.useProgram(D3.prog);
  gl.uniformMatrix4fv(D3.loc.uMVP, false, MVP);
  gl.uniformMatrix3fv(D3.loc.uNM, false, NM);
  const attr = (loc, buf) => { if(loc < 0) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0); };
  attr(D3.loc.aPos, D3.buf.p); attr(D3.loc.aNor, D3.buf.n); attr(D3.loc.aCol, D3.buf.c);
  gl.drawArrays(gl.TRIANGLES, 0, D3.count);
}
/* Гравировка считается не на каждое движение ползунка: обвести буквы дороже,
   чем пересобрать корпус. Корпус меняется сразу, надпись догоняет. */
function d3Engrave(m){
  const s = state;
  const key = [s.text_enable, s.p1, s.p2, s.p3, s.p4, s.p5, s.text_font, s.text_size,
    s.text_line_pitch, s.text_shift_h, s.text_shift_v, s.icon_type, s.icon_size,
    s.icon_shift_h, s.icon_shift_v, m.W, m.H, m.margin,
    s.icon_type === 99 ? (state.custom_icon || []).length : 0].join("|");
  if(key === D3.engKey) return D3.eng;
  clearTimeout(D3.timer);
  D3.timer = setTimeout(() => {
    D3.engKey = key;
    try { D3.eng = engraveRings(model()); }
    catch(e){ D3.eng = []; }
    D3.meshKey = null;
    d3Sync();
  }, 260);
  return D3.eng;
}
function d3Sync(){
  if(viewMode !== "d3") return;
  if(!d3Init()) return;
  const m = model();
  const eng = d3Engrave(m);
  const key = JSON.stringify(state) + "|" + isoMode + "|" + D3.engKey + "|" +
    (getComputedStyle(document.documentElement).getPropertyValue("--part") || "");
  if(key !== D3.meshKey){
    D3.meshKey = key;
    try { d3Upload(buildMesh(m, eng)); }
    catch(e){ D3.count = 0; }
  }
  d3Draw();
}
/* Холст WebGL кладётся поверх svg ровно на место панели: viewBox и реальные
   пиксели связаны одним масштабом, его тут и считаем. */
function d3Place(rect){
  const cv = document.getElementById("gl3");
  if(!cv) return;
  const svg = document.getElementById("view");
  const r = svg.getBoundingClientRect();
  const s = Math.min(r.width/CW, r.height/CH);
  const ox = (r.width - CW*s)/2, oy = (r.height - CH*s)/2;
  cv.hidden = false;
  cv.style.left   = (ox + rect[0]*s) + "px";
  cv.style.top    = (oy + (rect[1] + TITLE + 4)*s) + "px";
  cv.style.width  = (rect[2]*s) + "px";
  cv.style.height = ((rect[3] - TITLE - 4)*s) + "px";
}

/* ===================== раскладка ===================== */
function renderCanvas(m){
  const svg = document.getElementById("view");
  const box = svg.parentNode.getBoundingClientRect();
  CW = 1000;
  CH = Math.round(clamp(CW * (box.height || 620) / (box.width || 1000), 380, 900));
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  svg.setAttribute("viewBox", "0 0 " + CW + " " + CH);
  HANDLES = {};
  const g = el("g", {}, svg);

  const GAP = 8, RIGHT = Math.round(clamp(CW*0.315, 250, 340));
  const mainW = CW - RIGHT - GAP;
  const topH = Math.round(CH * 0.575);
  const smallH = Math.round(CH * 0.37);
  let lidPanel;
  const cv3 = document.getElementById("gl3");
  if(cv3) cv3.hidden = viewMode !== "d3";
  if(viewMode === "d3"){
    // Большое поле отдано объёму; изометрия и гравировка остаются справа,
    // как и в остальных режимах, — по ним и сверяются размеры.
    const P3 = panel(g, [0, 0, mainW, CH], [[0,0],[1,1]], PROJ.flat, T_("v_3d"),
      T_(isoMode === "closed" ? "closed" : "open"));
    viewIso(g, [mainW + GAP, 0, RIGHT, smallH], m, true);
    viewEngrave(g, [mainW + GAP, smallH + GAP, RIGHT, CH - smallH - GAP], m);
    if(D3.failed){
      // Без WebGL объём не показать — но остальное работает, и об этом надо
      // сказать словами, а не оставлять пустое поле.
      const t = el("text", {x:fmt(mainW/2), y:fmt(CH/2), "text-anchor":"middle",
        fill:"var(--ink-dim)", "font-size":"13",
        "font-family":"IBM Plex Sans, sans-serif"}, g);
      t.textContent = T_("d3_none");
      if(cv3) cv3.hidden = true;
    } else requestAnimationFrame(() => { d3Place([0, 0, mainW, CH]); d3Sync(); });
    return;
  }
  if(viewMode === "ortho"){
    // Слева — вид сверху и объёмный срез; справа вверху — закрытый кейс,
    // чтобы сразу было видно, как вещь выглядит собранной.
    lidPanel = viewTop(g, [0, 0, mainW, topH], m);
    viewCut(g, [0, topH + GAP, mainW, CH - topH - GAP], m);
    viewIso(g, [mainW + GAP, 0, RIGHT, smallH], m, true);
  } else {
    // В изометрии главное место занимает объём, а срез уходит в малый блок:
    // толщины и глубины остаются под рукой в обоих режимах.
    lidPanel = viewIso(g, [0, 0, mainW, CH], m, false);
    viewCut(g, [mainW + GAP, 0, RIGHT, smallH], m);
  }
  viewEngrave(g, [mainW + GAP, smallH + GAP, RIGHT, CH - smallH - GAP], m);

  if(viewMode === "ortho" && lidPanel){
    const a = lidPanel.toCanvas(m.p1cx, m.cz, m.T);
    const b = [mainW + GAP, smallH + GAP + (CH - smallH - GAP)/2];
    el("path", {d:"M "+fmt(a[0])+" "+fmt(a[1])+" C "+fmt((a[0]+b[0])/2)+" "+fmt(a[1])+
      " "+fmt((a[0]+b[0])/2)+" "+fmt(b[1])+" "+fmt(b[0])+" "+fmt(b[1]),
      fill:"none", stroke:"var(--accent)", "stroke-width":1.2, "stroke-dasharray":"5 4",
      opacity:"0.5"}, g);
    el("circle", {cx:fmt(a[0]), cy:fmt(a[1]), r:3, fill:"var(--accent)", opacity:"0.5"}, g);
  }
}

/* ===================== язык интерфейса =====================
   Строки собраны в одном месте и вынимаются через T_(). Пока здесь русский;
   остальные языки подставляются в LANGS ниже одним блоком, чтобы перевод
   нигде не оказался вшит в разметку. */
/* ===================== язык интерфейса =====================
   Все видимые строки собраны в одном месте и вынимаются через T_(). {0}/{1}
   — подстановки чисел: порядок слов в разных языках разный, поэтому склеивать
   строку из кусков нельзя.

const STATIC_TEXT = {tSub:"sub", helpBtn:"b_help", filesBtn:"b_files",
  tOrtho:"v3", tIso:"viso", tD3:"vd3", tOpen:"open", tClosed:"closed",
  tGrab:"grab", tSlide:"slide", tFilesH:"files_h", copyBtn:"copy",
  tHelpH:"help_h"};

/* ===================== подсказка под сценой ===================== */
function setHint(m){
  const L = layoutText(m);
  const legend = [["var(--hollow)", T_("lg_cav")], ["var(--brass-soft)", T_("lg_hinge")]];
  if(state.show_coin) legend.push(["var(--gold)", T_("lg_coin")]);
  const info = !state.text_enable ? T_("eng_off")
    : L.lines.length + " " + T_("lines_ab") + " · " + fmt(L.size) + " " + T_("mm")
      + (L.shrunk ? " · " + T_("shrunk") : "");
  document.getElementById("hint").innerHTML =
    legend.map(([c,x]) => '<span class="lg"><i style="background:'+c+'"></i>'+x+'</span>').join("")
    + '<span style="margin-left:auto;text-align:right">' + info + " · "
    + (viewMode === "d3" ? T_("tip_d3")
        : grabMode ? T_("tip_grab") : T_("tip_slide")) + '</span>';
}


/* ===================== пиктограммы у ползунков =====================
   Маленькая схема той же детали рядом с каждым ползунком: серым — контекст,
   акцентом — ровно тот элемент, за который ползунок отвечает. Так видно, что
   именно крутишь, не читая подпись. Все — в поле 24x16.
   ===================================================================== */
const PIC = (() => {
  const w = 'stroke-width="1.1" fill="none" stroke-linejoin="round"';
  const ctx = 'stroke="var(--line)" ' + w;

function picto(key){
  const d = PIC[key]; if(!d) return null;
  const n = document.createElementNS(NS, "svg");
  n.setAttribute("class","pic"); n.setAttribute("viewBox","0 0 24 16");
  n.setAttribute("aria-hidden","true");
  n.innerHTML = '<defs><marker id="pa" viewBox="0 0 8 8" refX="7" refY="4" ' +
    'markerWidth="4" markerHeight="4" orient="auto">' +
    '<path d="M0 0 L8 4 L0 8Z" fill="var(--accent)"/></marker></defs>' + d;
  return n;
}

/* ===================== панели управления ===================== */
const REFRESH = [];
function mk(tag, cls){ const n = document.createElement(tag); if(cls) n.className = cls; return n; }
function card(host, title, brass){
  const c = mk("section","card"), h = mk("h2");
  h.innerHTML = '<span class="dot'+(brass?" b":"")+'"></span>' + title;
  const b = mk("div","in");
  c.appendChild(h); c.appendChild(b); host.appendChild(c);
  return b;
}
function fRange(host, key, label, unit, min, max, step, note){
  const f = mk("div","f"), top = mk("div","top");
  const lb = mk("label"); lb.textContent = label; lb.setAttribute("for","r_"+key);
  const num = mk("span","num"), u = mk("span","u"); u.textContent = unit;
  const pc = picto(key);
  if(pc) top.appendChild(pc);
  top.append(lb, num, u); f.appendChild(top);
  const inp = mk("input"); inp.type="range"; inp.min=min; inp.max=max; inp.step=step;
  inp.id = "r_"+key; inp.value = state[key];
  inp.setAttribute("data-k", key);        // чтобы отмена вернула положение
  f.appendChild(inp);
  let nEl = null;
  if(note){ nEl = mk("div","note"); f.appendChild(nEl); }
  host.appendChild(f);
  inp.addEventListener("input", () => {
    pushUndo("range:"+key);               // тянут ползунок — один шаг, не сто
    state[key] = parseFloat(inp.value); render();
  });
  REFRESH.push(m => {
    inp.value = state[key]; num.textContent = fmt(state[key]); num.className = "num";
    if(note) note(nEl, m, num);
  });
}
function fText(host, key, label){
  const f = mk("div","f"), lb = mk("label");
  lb.textContent = label; lb.setAttribute("for","t_"+key);
  const inp = mk("input"); inp.type="text"; inp.id="t_"+key; inp.value=state[key];
  inp.maxLength = 60; inp.placeholder = T_("ph_empty");
  inp.setAttribute("data-k", key);
  f.append(lb, inp); host.appendChild(f);
  inp.addEventListener("input", () => {
    pushUndo("text:"+key);
    state[key] = inp.value; render();
  });
}
function fCheck(host, key, label){
  const l = mk("label","chk"), inp = mk("input"); inp.type="checkbox"; inp.checked = state[key];
  inp.setAttribute("data-k", key);
  l.append(inp, document.createTextNode(label)); host.appendChild(l);
  inp.addEventListener("change", () => {
    pushUndo(); state[key] = inp.checked; render();
  });
}
function fSelect(host, key, label, opts){
  const f = mk("div","f"), lb = mk("label");
  lb.textContent = label; lb.setAttribute("for","s_"+key);
  const sel = mk("select"); sel.id = "s_"+key; sel.setAttribute("data-k", key);
  for(const o of opts){ const op = mk("option"); op.value = o.v; op.textContent = o.n; sel.appendChild(op); }
  sel.value = state[key];
  f.append(lb, sel); host.appendChild(f);
  sel.addEventListener("change", () => {
    pushUndo();
    state[key] = (typeof state[key] === "number") ? parseFloat(sel.value) : sel.value;
    render();
  });
}

/* ===================== генерация .scad ===================== */
function setVar(src, name, lit){
  const re = new RegExp("^(" + name + "\\s*=\\s*)([^;]*)(;)", "m");
  if(!re.test(src)) console.warn("параметр не найден:", name);
  return src.replace(re, (mm,a,b,c) => a + lit + c);
}
const nm = v => (Math.round(v*1000)/1000).toString();
const st_ = v => JSON.stringify(String(v));
// В англоязычной версии переменные названы развёрнуто: MakerWorld подписывает
// ползунок ИМЕНЕМ переменной, а не комментарием, и "coin d" читалось плохо.
// Здесь то же соответствие, что и в генераторе файла, — иначе подстановка
// значений промахнулась бы мимо переименованных строк.
const EN_NAMES = {coin_d:"coin_diameter", coin_t:"coin_thickness",
  coin_clear:"coin_clearance", case_w:"case_width", case_h:"case_height",
  case_t:"case_thickness", wall_min:"min_wall", lid_share:"lid_share_of_cavity",
  lid_extra:"lid_pocket_trim", base_extra:"base_pocket_trim"};
function buildScad(part, en){
  const m = model(), s = state, L = layoutText(m);
  let src = en ? SCAD_EN : SCAD_RU;
  const V = k => en ? (EN_NAMES[k] || k) : k;
  src = setVar(src, V("render_part"), st_(part));
  for(const k of ["coin_d","coin_t","coin_clear","case_w","case_h","case_t","wall_min",
                  "coin_gap_axial","lid_share","lid_extra","base_extra",
                  "finger_notch_d","finger_notch_depth","finger_notch_corner",
                  "finger_notch_fillet","finger_notch_corner","text_line_pitch","text_depth",
                  "text_shift_h","text_shift_v","icon_type","icon_size",
                  "icon_shift_h","icon_shift_v"])
    src = setVar(src, V(k), nm(s[k]));
  src = setVar(src, V("finger_notch_enable"), s.finger_notch_enable ? "true" : "false");
  src = setVar(src, V("text_enable"), s.text_enable ? "true" : "false");
  src = setVar(src, V("show_coin"), s.show_coin ? "true" : "false");
  // В файл уходят только цвета половинок: у надписи отдельного тела нет,
  // она вырезана в крышке, поэтому её цвет живёт лишь на странице.
  if(s.icon_type === 99 && s.custom_icon){
    const pts = [], paths = [];
    let n = 0;
    for(const L of s.custom_icon){
      paths.push("[" + L.map((_, i) => n + i).join(",") + "]");
      for(const q of L) pts.push("[" + nm(q[0]) + "," + nm(q[1]) + "]");
      n += L.length;
    }
    src = setVar(src, "custom_icon_pts", "[" + pts.join(",") + "]");
    src = setVar(src, "custom_icon_paths", "[" + paths.join(",") + "]");
  }
  src = setVar(src, V("lid_color"),  st_((s.colors && s.colors.lid)  || ""));
  src = setVar(src, V("base_color"), st_((s.colors && s.colors.base) || ""));
  src = setVar(src, V("finger_notch_shape"), String(s.finger_notch_shape));
  src = setVar(src, V("text_font"), st_(s.text_font));
  // Кегль и перенос строк считает страница — она умеет мерить текст
  // по-настоящему, поэтому в файл уходит готовый результат, а грубый
  // автоподгон самого OpenSCAD выключается: печать совпадёт с превью.
  src = setVar(src, V("text_size"), nm(L.size));
  src = setVar(src, V("text_autofit"), "false");
  for(let i=0;i<8;i++) src = setVar(src, "text_line" + (i+1), st_(L.lines[i] || ""));
  return src;
}

const FILE_SETS = [

];
let activeFile = null;
function buildFiles(){
  const host = document.getElementById("filegrid");

    const b = mk("button","fbtn"); b.type = "button"; b.dataset.file = d.file;
    b.innerHTML = "<span class='t'>"+esc(T_(d.t))+"</span><span class='d'>"+esc(T_(d.d))+"</span>";
    b.addEventListener("click", () => showFile(d));
    host.appendChild(b);
  }
}
async function showFile(d){
  const src = buildScad(d.part, d.en);
  activeFile = {name:d.file, src};
  document.getElementById("srcBox").value = src;
  document.getElementById("fileNote").innerHTML = T_("file_note", "<b>" + d.file + "</b>");
  for(const b of document.querySelectorAll(".fbtn"))
    b.setAttribute("aria-current", String(b.dataset.file === d.file));
  await copyActive(true);
}
async function copyActive(quiet){
  if(!activeFile) return;
  try{ await navigator.clipboard.writeText(activeFile.src);
       toast(T_("toast_copied", activeFile.name)); }
  catch(e){ const b = document.getElementById("srcBox"); b.focus(); b.select();
       if(!quiet) toast(T_("toast_manual")); }
}
let toastEl = null;
function toast(msg){
  if(!toastEl){
    toastEl = document.createElement("div");
    toastEl.style.cssText = "position:fixed;left:50%;bottom:22px;transform:translateX(-50%);" +
      "background:var(--ink);color:var(--ground);padding:9px 15px;border-radius:8px;" +
      "font-size:12.5px;z-index:99;max-width:88vw;text-align:center;box-shadow:var(--shadow)";
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg; toastEl.style.display = "block";
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => { toastEl.style.display = "none"; }, 4000);
}

/* ===================== инструкция =====================
   Шаги сняты с живых окон: MakerWorld — через браузер, с реальной вставкой
   этой модели; OpenSCAD — с настоящего окна программы, открывшей этот же
   файл. Всё личное на снимках замазано.

   Стрелки и подписи не впечатаны в картинку, а рисуются поверх неё: иначе
   при смене языка подписи остались бы русскими, а перерисовать десять
   комплектов снимков нечем. Координаты — в процентах от кадра. */
const esc = t => String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function shot(key, marks){
  const im = SHOTS[key]; if(!im) return "";
  const [w, h] = SHOT_SIZE[key] || [900, 600];
  // Слой разметки живёт в системе «100 единиц по ширине», высота — по
  // пропорции кадра. Масштаб одинаковый по обеим осям, иначе подписи
  // растягивало вслед за картинкой: буквы разъезжались во всю ширину.
  const H = 100 * h / w, Y = v => v * H / 100;
  let ov = '<defs><marker id="ar' + key + '" viewBox="0 0 10 10" refX="9" refY="5" ' +
    'markerWidth="4.5" markerHeight="4.5" orient="auto">' +
    '<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--brass)"/></marker></defs>';
  for(const [x1,y1,x2,y2,tk,anch] of (marks || [])){
    ov += '<path d="M ' + x2 + ' ' + fmt(Y(y2)) + ' L ' + x1 + ' ' + fmt(Y(y1)) +
      '" class="sa" marker-end="url(#ar' + key + ')"/>' +
      '<text x="' + x2 + '" y="' + fmt(Y(y2) + (y2 < 12 ? 4 : -1.8)) + '" class="st"' +
      ' text-anchor="' + (anch || "middle") + '">' + esc(T_(tk)) + '</text>';
  }
  return '<figure class="shot"><img src="' + im + '" alt="" loading="lazy" ' +
    'width="' + w + '" height="' + h + '">' +
    '<svg viewBox="0 0 100 ' + fmt(H) + '" aria-hidden="true">' + ov + '</svg></figure>';
}
const step = (t, d, extra) =>
  '<li><div><p>' + T_(t) + '</p><small>' + T_(d) + '</small>' + (extra || "") + '</div></li>';

function helpHTML(tab){
  if(tab === "mw") return '<ol class="steps">' +
    step("mw1", "mw1d") +
    step("mw2", "mw2d", shot("mw_menu", [[64, 64, 64, 22, "mk_blank"]])) +
    step("mw3", "mw3d", shot("mw_code", [[74, 26, 42, 58, "mk_paste"]])) +
    step("mw4", "mw4d", shot("mw_sliders", [[45, 30, 62, 12, "mk_groups"],
                                            [40, 63, 62, 78, "mk_sliders"]])) +
    step("mw5", "mw5d", shot("mw_result", [[50, 42, 62, 20, "mk_generated"]])) +
    step("mw6", "mw6d") +
    '</ol>';
  return '<ol class="steps">' +
    step("os1", "os1d") +
    step("os2", "os2d") +
    step("os3", "os3d", shot("os_main", [[84, 24, 74, 8, "mk_customizer"],
                                         [46, 58, 27, 74, "mk_preview"]])) +
    step("os4", "os4d", shot("os_design", [[27, 47, 46, 66, "mk_render", "start"]])) +
    step("os5", "os5d", shot("os_export", [[57, 52, 74, 30, "mk_stl", "end"]])) +
    step("os6", "os6d") +
    '</ol>';
}

/* ===================== сборка ===================== */
function renderChips(m){
  const cells = [
    {k:T_("c_size"),   v:fmt(m.W)+"×"+fmt(m.H), a:m.wAuto||m.hAuto},
    {k:T_("c_thick"),  v:fmt(2*m.T),            a:m.tAuto},
    {k:T_("c_cavity"), v:"Ø"+fmt(m.cav_d),      a:false},
    {k:T_("c_gap"),    v:fmt(m.coinGap),        a:m.coinGap < 0.15}
  ];
  document.getElementById("chips").innerHTML = cells.map(c =>
    "<div><div class='k'>"+c.k+"</div><div class='v"+(c.a?" auto":"")+"'>"+c.v+"</div></div>").join("");
}
function render(){
  const m = model();
  document.getElementById("ctxIso").hidden = viewMode === "ortho";
  for(const fn of REFRESH) fn(m);
  renderChips(m);
  renderCanvas(m);
  setHint(m);
}

document.getElementById("viewmode").addEventListener("click", e => {
  const b = e.target.closest("button[data-vm]"); if(!b) return;
  viewMode = b.dataset.vm;
  for(const x of e.currentTarget.querySelectorAll("button"))
    x.setAttribute("aria-pressed", String(x === b));
  render();
});
document.getElementById("modes").addEventListener("click", e => {
  const b = e.target.closest("button[data-m]"); if(!b) return;
  grabMode = b.dataset.m === "grab";
  for(const x of e.currentTarget.querySelectorAll("button"))
    x.setAttribute("aria-pressed", String(x === b));
  render();
});
document.getElementById("ctxIso").addEventListener("click", e => {
  const b = e.target.closest("button[data-iso]"); if(!b) return;
  isoMode = b.dataset.iso;
  for(const x of e.currentTarget.querySelectorAll("button"))
    x.setAttribute("aria-pressed", String(x === b));
  render();
});
document.getElementById("filesBtn").addEventListener("click", () => {
  document.getElementById("filesDlg").showModal();
  if(!activeFile) showFile(FILE_SETS[0]);
  else showFile(FILE_SETS.find(f => f.file === activeFile.name) || FILE_SETS[0]);
});
document.getElementById("copyBtn").addEventListener("click", () => copyActive(false));
document.getElementById("helpBtn").addEventListener("click", () => {
  document.getElementById("helpDlg").showModal();
});
document.getElementById("helpTabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-h]"); if(!b) return;
  for(const x of e.currentTarget.querySelectorAll("button"))
    x.setAttribute("aria-pressed", String(x === b));
  helpTab = b.dataset.h;
  document.getElementById("helpBody").innerHTML = helpHTML(helpTab);
});
for(const b of document.querySelectorAll("[data-close]"))
  b.addEventListener("click", e => e.target.closest("dialog").close());

/* Смена языка перерисовывает всё, что содержит текст: панели строятся
   заново, диалоги — тоже. Значения модели при этом не трогаются. */
let helpTab = "mw";
function applyLang(){
  document.documentElement.lang = lang;
  for(const [id, k] of Object.entries(STATIC_TEXT)){
    const e = document.getElementById(id); if(e) e.textContent = T_(k);
  }
  for(const b of document.querySelectorAll(".tClose")) b.textContent = T_("close");
  const tn = document.getElementById("trNote"); if(tn) tn.textContent = T_("tr_note");
  document.getElementById("railL").innerHTML = "";
  document.getElementById("railR").innerHTML = "";
  REFRESH.length = 0;
  buildRails();
  buildPalette();
  document.getElementById("filegrid").innerHTML = "";
  buildFiles();
  const sh = document.getElementById("tStlH"); if(sh) sh.textContent = T_("stl_h");
  const sb = document.getElementById("stlBtn");
  if(sb){ sb.textContent = T_("stl_btn"); sb.hidden = !STL_ENABLED; }
  if(STL_ENABLED) buildStlPanel();
  const ph = document.getElementById("tPicH"); if(ph) ph.textContent = T_("pic_h");
  const pa = document.getElementById("picApply"); if(pa) pa.textContent = T_("pic_apply");
  for(const b of document.querySelectorAll("#helpTabs button"))
    b.textContent = T_(b.dataset.h === "mw" ? "tab_mw" : "tab_os");
  document.getElementById("helpBody").innerHTML = helpHTML(helpTab);
  if(activeFile) showFile(FILE_SETS.find(f => f.file === activeFile.name) || FILE_SETS[0]);
  // Подбор масштаба только ПОСЛЕ render(): пояснения под ползунками
  // заполняются именно там, а до этого карточки короче — и масштаб выходил
  // завышенным, из-за чего нижнюю карточку срезало.
  render();
  fitRails();
  requestAnimationFrame(() => { fitRails(); render(); });
}
const langSel = document.getElementById("lang");
for(const [code, name] of LANGS){
  const o = document.createElement("option"); o.value = code; o.textContent = name;
  langSel.appendChild(o);
}
// Язык браузера подхватывается, если он у нас есть; иначе английский.
const navLang = (navigator.language || "en").slice(0,2).toLowerCase();
lang = LANGS.some(([c]) => c === navLang) ? navLang : "en";
try{ const saved = localStorage.getItem("ccr_lang");
     if(saved && LANGS.some(([c]) => c === saved)) lang = saved; }catch(e){}
langSel.value = lang;
langSel.addEventListener("change", () => {
  lang = langSel.value;
  try{ localStorage.setItem("ccr_lang", lang); }catch(e){}
  applyLang();
});

initDrag();
if(STL_ENABLED)
  document.getElementById("stlBtn").addEventListener("click",
    () => document.getElementById("stlDlg").showModal());
applyLang();
/* Карточки растягиваются под свободное место, но не больше чем в полтора
   раза: жёсткий множитель вернул бы прокрутку на ноутбуках, а так на большом
   мониторе они вырастают почти на максимум, на маленьком — насколько влезет.

   Высота не строго линейна по масштабу (переносы строк в пояснениях меняются
   скачком), поэтому после первой прикидки идёт пара уточняющих шагов. */
function fitRails(){
  for(const id of ["railL", "railR"]){
    const r = document.getElementById(id); if(!r) continue;
    const avail = r.clientHeight; if(!avail) continue;
    const measure = () => {
      const kids = Array.from(r.children);
      const gap = parseFloat(getComputedStyle(r).rowGap) || 0;
      return kids.reduce((a, c) => a + c.offsetHeight, 0) + gap*Math.max(0, kids.length-1);
    };
    const setK = v => r.style.setProperty("--k", fmt(Math.round(v*1000)/1000));
    setK(1);
    const base = measure(); if(base < 8) continue;
    let k = clamp(avail / base, 0.8, 1.5);
    setK(k);
    for(let i = 0; i < 5; i++){
      const now = measure();
      if(now <= avail - 1) break;
      k = clamp(k * (avail - 1) / now, 0.75, 1.5);
      setK(k);
    }
  }
}
const fitSoon = () => requestAnimationFrame(() => { fitRails(); render(); });
addEventListener("resize", fitSoon);
/* Первый подбор попадает на момент, когда веб-шрифт ещё не применён: карточки
   тогда ниже, масштаб выходит завышенным, а после подмены шрифта содержимое
   вылезает. Поэтому пересчитываем и на следующем кадре, и по готовности
   шрифтов. */
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitSoon);
setTimeout(fitSoon, 60);
