/* ===================== отмена шагов =====================
   Состояние маленькое и целиком сериализуемо, поэтому история хранится
   снимками, а не списком действий: так отменяется что угодно — и ползунок, и
   перетаскивание, и заливка цветом, и применённая картинка.

   Снимок кладётся ПЕРЕД изменением и только если состояние действительно
   отличается от последнего: иначе каждое движение ползунка на один шаг
   забивало бы историю сотней одинаковых записей. Подряд идущие правки одного
   и того же параметра склеиваются по времени — одно перетаскивание считается
   одним шагом. */
const UNDO_LIMIT = 80;
let undoStack = [], redoStack = [], undoLast = 0, undoKey = null;
const snapState = () => JSON.stringify(state);
function pushUndo(key){
  const now = Date.now();
  const same = key && key === undoKey && now - undoLast < 700;
  undoLast = now; undoKey = key || null;
  if(same) return;
  const snap = snapState();
  if(undoStack.length && undoStack[undoStack.length-1] === snap) return;
  undoStack.push(snap);
  if(undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
}
function applySnapshot(json){
  const o = JSON.parse(json);
  for(const k of Object.keys(state)) delete state[k];
  Object.assign(state, o);
  syncControls();
  render();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snapState());
  applySnapshot(undoStack.pop());
  undoKey = null;
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapState());
  applySnapshot(redoStack.pop());
  undoKey = null;
}
/* После отмены поля и ползунки должны показать вернувшиеся значения. */
function syncControls(){
  for(const el of document.querySelectorAll("[data-k]")){
    const k = el.getAttribute("data-k"), v = state[k];
    if(v === undefined) continue;
    if(el.type === "checkbox") el.checked = !!v;
    else el.value = v;
  }
  for(const fn of REFRESH) fn(model());
}
addEventListener("keydown", e => {
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")
     && !t.classList.contains("hedit")) return;
  const z = e.key === "z" || e.key === "Z" || e.key === "я" || e.key === "Я";
  const y = e.key === "y" || e.key === "Y" || e.key === "н" || e.key === "Н";
  if(!(e.ctrlKey || e.metaKey)) return;
  if(z && !e.shiftKey){ e.preventDefault(); undo(); }
  else if((z && e.shiftKey) || y){ e.preventDefault(); redo(); }
});
/* ===================== палитра и заливка =====================
   Цвет здесь — предпросмотр. STL цвета не хранит, и реальную многоцветность
   всё равно назначают в слайсере; в .scad уходят только цвета половинок через
   color(), чтобы предпросмотр в OpenSCAD совпадал со страницей. Надпись —
   углубление, отдельного тела у неё нет, поэтому её цвет живёт только на
   странице: об этом прямо сказано в подсказке под палитрой. */
const SWATCHES = ["#C0392B","#D35400","#E1A730","#27AE60","#1F8A8A","#2E6FBF",
                  "#6C4AB6","#B03A76","#2C3E50","#8A8F98","#F2F2F0","#111417"];
let brush = null;                 // выбранный цвет или "erase"
const paintKeys = ["lid","base","icon","line1","line2","line3","line4","line5"];
function colorOf(key, fallback){
  const c = state.colors && state.colors[key];
  return c || fallback;
}
function buildPalette(){
  const host = document.getElementById("palette");
  host.innerHTML = "";
  const mkSw = (c, cls, title) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "sw" + (cls ? " " + cls : "");
    if(c) b.style.background = c;
    b.title = title || c;
    b.addEventListener("click", () => {
      brush = (brush === (c || "erase")) ? null : (c || "erase");
      syncPalette();
    });
    b.dataset.c = c || "erase";
    host.appendChild(b);
  };
  for(const c of SWATCHES) mkSw(c);
  mkSw(null, "erase", T_("pal_clear"));
  const inp = document.createElement("input");
  inp.type = "color"; inp.className = "swpick"; inp.value = "#3AA0A0";
  inp.title = T_("pal_custom");
  inp.addEventListener("input", () => { brush = inp.value; syncPalette(); });
  host.appendChild(inp);
  syncPalette();
}
function syncPalette(){
  for(const b of document.querySelectorAll("#palette .sw"))
    b.setAttribute("aria-pressed", String(b.dataset.c === brush));
  document.body.classList.toggle("painting", !!brush);
  const h = document.getElementById("palHint");
  if(h) h.textContent = brush ? T_("pal_on") : T_("pal_off");
}
/* Клик по детали красит её выбранным цветом. Цели помечены data-paint. */
/* Красим по НАЖАТИЮ, а не по click. Наведение мыши перерисовывает холст
   целиком (подсветка рукояток), элемент под курсором успевает исчезнуть, и
   событие click браузер уже не выдаёт — клики по деталям просто терялись. */
function paintAt(ev){
  if(!brush) return false;
    // closest() смотрит только вверх по предкам, а в SVG грани — соседи, а не
    // предки: клик по дну кармана или по накладке светотени не находил
    // ничего. Поэтому берём всё, что под курсором, и ищем первую крашеную.
    let t = ev.target.closest("[data-paint]");
    if(!t){
      for(const e of document.elementsFromPoint(ev.clientX, ev.clientY)){
        if(e.hasAttribute && e.hasAttribute("data-paint")){ t = e; break; }
        if(e.id === "view") break;
      }
    }
  if(!t) return false;
  const key = t.getAttribute("data-paint");
  pushUndo();
  if(!state.colors) state.colors = {};
  if(brush === "erase") delete state.colors[key];
  else state.colors[key] = brush;
  render();
  return true;
}

/* ===================== холст и панели ===================== */
let CW = 1000, CH = 620;
const PADP = 12, TITLE = 15;
let HANDLES = {}, drag = null, hoverH = null;

function toUser(ev){
  const svg = document.getElementById("view");
  const ctm = svg.getScreenCTM(); if(!ctm) return null;
  const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform(ctm.inverse());
}
function panel(host, rect, pts, proj, title, note){
  const [rx, ry, rw, rh] = rect;
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  for(const q of pts){ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
                       if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; }
  const bw = Math.max(x1-x0, 1e-6), bh = Math.max(y1-y0, 1e-6);
  const s = Math.min((rw - 2*PADP)/bw, (rh - TITLE - 2*PADP)/bh);
  const tx = rx + (rw - bw*s)/2 - x0*s;
  const ty = ry + TITLE + (rh - TITLE - bh*s)/2 - y0*s;
  el("rect", {x:rx, y:ry, width:rw, height:rh, rx:8, fill:"var(--panel-2)",
    stroke:"var(--line-soft)", "stroke-width":1}, host);
  const t = el("text", {x:rx+10, y:ry+12, "font-size":9.5, "letter-spacing":"0.09em",
    fill:"var(--ink-dim)", "font-family":"IBM Plex Sans, sans-serif"}, host);
  t.textContent = title.toUpperCase();
  if(note){
    const n = el("text", {x:rx+rw-10, y:ry+12, "font-size":9, "text-anchor":"end",
      fill:"var(--ink-dim)", "font-family":"IBM Plex Mono, monospace"}, host);
    n.textContent = note;
  }
  const g = el("g", {transform:"translate("+fmt(tx)+","+fmt(ty)+") scale("+fmt(s)+")"}, host);
  return {g, s, proj, rect,
    toCanvas: (u,v,w) => { const q = pj(proj,u,v,w); return [tx+q[0]*s, ty+q[1]*s]; }};
}

/* ===================== манипуляторы =====================
   Крупнее прежних и со стрелками направления: по кружку видно, куда его
   тянуть, ещё до того как схватишь. Область захвата шире рисунка. */
const ARROWS = {
  u:  "M -1 0 h 2 M -1 0 l .45 -.34 M -1 0 l .45 .34 M 1 0 l -.45 -.34 M 1 0 l -.45 .34",
  v:  "M 0 -1 v 2 M 0 -1 l -.34 .45 M 0 -1 l .34 .45 M 0 1 l -.34 -.45 M 0 1 l .34 -.45",
  r:  "M .28 0 h .8 M 1.08 0 l -.36 -.3 M 1.08 0 l -.36 .3",
  uv: "M -1 0 h 2 M 0 -1 v 2 M -1 0 l .4 -.3 M 1 0 l -.4 .3 M 0 -1 l -.3 .4 M 0 1 l .3 -.4"
};
function handle(P, id, u, v, w, opts){
  if(!grabMode) return;
  const q = pj(P.proj, u, v, w || 0);
  const R = 8.5 / P.s;
  HANDLES[id] = Object.assign({panel:P, at:[u, v, w || 0]}, opts);
  const g = el("g", {transform:"translate("+fmt(q[0])+","+fmt(q[1])+")"}, P.g);
  el("circle", {r:fmt(R*1.9), fill:"transparent", class:"hhit", "data-h":id,
    "pointer-events":"all"}, g);
  el("circle", {r:fmt(R), class:"hnd" + (hoverH === id ? " on" : ""), "data-h":id}, g);
  const dir = ARROWS[opts.arrow || (opts.axis === "v" || opts.axis === "w" ? "v" : "u")];
  if(dir) el("path", {d:dir, class:"harr", transform:"scale("+fmt(R*0.62)+")",
    "pointer-events":"none"}, g);
  if(opts.tip && hoverH === id && !drag){
    // Плашка меряется по НАСТОЯЩЕЙ ширине надписи: прикидка по числу букв не
    // сходилась, и цифры вылезали за рамку.
    const fs = 12/P.s, pad = fs*0.42;
    const t = el("text", {x:fmt(R*1.4 + pad), y:fmt(-R*1.4 - pad), class:"htip",
      "font-size":fmt(fs), "pointer-events":"none"}, g);
    t.textContent = opts.tip + (opts.set ? "  ✎" : "");
    let bb = null; try{ bb = t.getBBox(); }catch(e){}
    if(bb && bb.width){
      const r = el("rect", {x:fmt(bb.x - pad), y:fmt(bb.y - pad*0.5),
        width:fmt(bb.width + pad*2), height:fmt(bb.height + pad),
        rx:fmt(fs*0.32), fill:"var(--tipbg)", stroke:"var(--line)",
        "stroke-width":fmt(0.9/P.s), "pointer-events":"none"}, g);
      g.insertBefore(r, t);
    }
  }
}
/* Клик по рукоятке — поле ввода прямо на месте подписи: значение уже стоит в
   поле, границы те же, что у ползунка. Перетаскивание никуда не девается —
   короткое нажатие без сдвига считается кликом, всё остальное тянет. */
let editBox = null;
function closeEditor(){
  // Enter применяет и убирает поле, следом прилетает blur и пытается убрать
  // его второй раз — отсюда была ошибка «узел уже не потомок».
  const b = editBox; editBox = null;
  if(b && b.parentNode) b.parentNode.removeChild(b);
}
function openEditor(h){
  closeEditor();
  if(!h.set || !h.val) return;
  const svg = document.getElementById("view"), ctm = svg.getScreenCTM();
  if(!ctm) return;
  const c = h.panel.toCanvas(h.at[0], h.at[1], h.at[2]);
  const pt = svg.createSVGPoint(); pt.x = c[0]; pt.y = c[1];
  const sp = pt.matrixTransform(ctm);
  const box = document.createElement("input");
  box.type = "text"; box.inputMode = "decimal"; box.className = "hedit";
  box.value = fmt(h.val());
  box.style.left = Math.round(sp.x + 14) + "px";
  box.style.top  = Math.round(sp.y - 36) + "px";
  document.body.appendChild(box);
  editBox = box; box.focus(); box.select();
  const apply = () => {
    const v = parseFloat(String(box.value).replace(",", "."));
    closeEditor();
    if(isFinite(v)){ pushUndo(); h.set(v); render(); }
  };
  box.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); apply(); }
    else if(e.key === "Escape"){ e.preventDefault(); closeEditor(); }
    e.stopPropagation();
  });
  box.addEventListener("blur", apply);
}
function grip(P, id, d, opts){
  if(!grabMode) return;
  HANDLES[id] = Object.assign({panel:P}, opts);
  el("path", {d, class:"grip", "data-h":id, "pointer-events":"all",
    "stroke-width":fmt(1.3/P.s)}, P.g);
}
function initDrag(){
  const svg = document.getElementById("view");
  svg.addEventListener("pointerdown", ev => {
    if(paintAt(ev)){ ev.preventDefault(); return; }
    const t = ev.target.closest("[data-h]"); if(!t) return;
    const h = HANDLES[t.getAttribute("data-h")]; if(!h) return;
    ev.preventDefault(); svg.setPointerCapture(ev.pointerId);
    closeEditor();
    pushUndo("drag:" + t.getAttribute("data-h"));
    drag = {h, p0:toUser(ev), snap:Object.assign({}, state), moved:false,
            t0:Date.now(), sx:ev.clientX, sy:ev.clientY};
    document.body.style.cursor = "grabbing";
  });
  svg.addEventListener("pointermove", ev => {
    if(!drag){
      const t = ev.target.closest("[data-h]");
      const id = t ? t.getAttribute("data-h") : null;
      if(id !== hoverH){ hoverH = id; render(); }
      return;
    }
    const p = toUser(ev); if(!p) return;
    if(Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) > 4) drag.moved = true;
    const P = drag.h.panel;
    const dx = (p.x - drag.p0.x)/P.s, dy = (p.y - drag.p0.y)/P.s;
    drag.h.move(axisMove(P.proj, drag.h.axis || "u", dx, dy), drag.snap, {dx, dy});
    render();
  });
  const stop = () => {
    if(!drag) return;
    const d = drag; drag = null; document.body.style.cursor = "";
    if(!d.moved && Date.now() - d.t0 < 500) openEditor(d.h);
    render();
  };
  svg.addEventListener("pointerup", stop);
  svg.addEventListener("pointercancel", stop);
  svg.addEventListener("pointerleave", () => { if(!drag && hoverH){ hoverH = null; render(); } });
}
const clamp = (v,a,b) => Math.min(Math.max(v,a), b);
const q1 = (v,step) => Math.round(v/step)*step;

/* ===================== тела =====================
   Боковина собирается ОДНОЙ фигурой: видимые грани идут подряд, из них
   строится сплошная лента. Раньше каждая грань рисовалась своей трапецией со
   своей обводкой, и на скруглённом углу получался частокол штрихов. */
// Тест «грань повёрнута к зрителю» смотрит на знак площади четырёхугольника
// НА ЭКРАНЕ, поэтому и обход контура надо приводить к единому в экранных
// координатах, а не в модельных: часть контуров зеркальна, да и сама проекция
// может переворачивать ориентацию. Считали в модельных — у половинок вместо
// боковины вылезали случайные треугольники.
const ccw = (P, ring) => sArea(pjRing(P, ring, 0)) < 0 ? ring.slice().reverse() : ring;
/* ===================== свет =====================
   Яркость грани — от наклона её нормали к свету. Красится не подменой цвета
   (он зависит от темы), а полупрозрачной накладкой поверх той же фигуры:
   работает в светлой и в тёмной одинаково. */
const LIGHT = (() => { const v = [-0.40, -0.52, 0.75];
  const n = Math.hypot(v[0], v[1], v[2]); return v.map(x => x/n); })();
function lit(nu, nv, nw){
  const n = Math.hypot(nu, nv, nw) || 1;
  return 0.44 + 0.56*Math.max(0, (nu*LIGHT[0] + nv*LIGHT[1] + nw*LIGHT[2])/n);
}
function shade(g, pts, b, d, flat){
  if(flat) return;
  const up = b > 0.66, op = up ? (b-0.66)*0.9 : (0.66-b)*0.55;
  if(op <= 0.005) return;
  const a = {fill: up ? "#fff" : "#000", opacity:fmt(op), stroke:"none",
             "pointer-events":"none"};
  if(d){ a.d = d; a["fill-rule"] = "evenodd"; } else a.points = pstr(pts);
  el(d ? "path" : "polygon", a, g);
}
/* Штриховка разреза. Рисуется настоящими линиями внутри контура: у SVG-
   паттерна шаг пришлось бы согласовывать с масштабом панели, а тут он задан
   прямо в миллиметрах детали. Две детали штрихуются в РАЗНЫЕ стороны — так
   на чертеже и отличают одну деталь от соседней. */
let hatchSeq = 0;
function hatch(g, poly, dir, step, cls){
  const id = "hx" + (++hatchSeq);
  const cp = el("clipPath", {id}, el("defs", {}, g));
  el("polygon", {points:pstr(poly)}, cp);
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  for(const q of poly){ if(q[0]<x0)x0=q[0]; if(q[0]>x1)x1=q[0];
                        if(q[1]<y0)y0=q[1]; if(q[1]>y1)y1=q[1]; }
  const gg = el("g", {"clip-path":"url(#"+id+")", "pointer-events":"none"}, g);
  const h = y1 - y0, span = (x1-x0) + h;
  for(let t = -span; t <= span; t += step)
    el("line", {x1:fmt(x0+t), y1:fmt(y0), x2:fmt(x0 + t + dir*h), y2:fmt(y1),
      stroke:"var(--part-edge)", "stroke-width":fmt(cls.sw*0.5), opacity:"0.3"}, gg);
}
const sArea = pts => { let a = 0;
  for(let i=0;i<pts.length;i++){ const p=pts[i], q=pts[(i+1)%pts.length];
    a += p[0]*q[1] - q[0]*p[1]; } return a/2; };
/* Какие боковые грани видны. Считается не по знаку площади четырёхугольника
   (он зависит от обхода контура и от того, переворачивает ли проекция
   ориентацию — на зеркальной половинке это давало вместо боковины пару
   случайных треугольников), а честно: грань видна, если её внешняя нормаль
   на экране смотрит туда же, куда уходит низ тела относительно верха. */
function visMask(P, ring, w0, w1){
  const n = ring.length, pr = pjRing(P, ring, w1);
  const sgn = sArea(pr) > 0 ? 1 : -1;
  const o1 = pj(P, 0, 0, w1), o0 = pj(P, 0, 0, w0);
  const sh = [o0[0]-o1[0], o0[1]-o1[1]];
  if(Math.abs(sh[0]) + Math.abs(sh[1]) < 1e-9) return null;   // плоский вид
  const vis = [];
  for(let i=0;i<n;i++){
    const a = pr[i], b = pr[(i+1)%n];
    vis.push(sgn*(b[1]-a[1])*sh[0] - sgn*(b[0]-a[0])*sh[1] > 0);
  }
  vis.sgn = sgn;
  return vis;
}
/* Внешняя нормаль ребра в модельных осях — с учётом направления обхода,
   которое у зеркального контура обратное. */
const edgeNormal = (a, b, sgn) => [sgn*(b[1]-a[1]), -sgn*(b[0]-a[0])];
/* Все непрерывные куски видимой боковины, а не только первый. У раскрытой
   половинки видимые грани идут одной дугой, а у закрытого кейса — двумя
   кусками по разные стороны от прямого угла петли; когда брался только
   первый, боковина рисовалась огрызком у одного угла. */
function visibleRuns(P, ring, w0, w1){
  const vis = visMask(P, ring, w0, w1); if(!vis) return [];
  const n = vis.length;
  if(vis.every(x => x)) return [[0, n]];
  if(vis.every(x => !x)) return [];
  const runs = [];
  for(let i=0;i<n;i++){
    if(!vis[i] || vis[(i-1+n)%n]) continue;
    let len = 0; while(len < n && vis[(i+len)%n]) len++;
    runs.push([i, len]);
  }
  return runs;
}
function sideBands(P, ring, w0, w1){
  return visibleRuns(P, ring, w0, w1).map(([st, len]) => {
    const n = ring.length, top = [], bot = [];
    for(let k=0;k<=len;k++){ const q = ring[(st+k)%n];
      top.push(pj(P,q[0],q[1],w1)); bot.push(pj(P,q[0],q[1],w0)); }
    return top.concat(bot.reverse());
  });
}
/* Копилка боковых граней. Каждая грань попадает в корзину по своему уровню
   освещённости, и вся корзина выводится ОДНИМ путём. Раньше грань была
   отдельным многоугольником: на скруглённом углу их десятки, и между
   соседними оставался светлый волосок сглаживания — на виде это читалось
   частоколом вертикальных полосок. Внутри одного пути соседние подконтуры
   растрируются как одна область, и швов не остаётся. */
function faceBin(){
  const map = new Map();
  return {
    add(q, b){
      const key = Math.round(b*40);
      const rec = map.get(key) || {b:key/40, d:""};
      rec.d += (rec.d ? " " : "") +
        "M " + q.map(p => fmt(p[0])+" "+fmt(p[1])).join(" L ") + " Z";
      map.set(key, rec);
    },
    flush(g, P, fill, cls, extra){
      const rs = [...map.values()];
      if(!rs.length) return;
      el("path", Object.assign({d:rs.map(r => r.d).join(" "), "fill-rule":"evenodd",
        fill, stroke:fill, "stroke-width":fmt(cls.sw*0.5),
        "stroke-linejoin":"round"}, extra || {}), g);
      for(const r of rs) shade(g, null, r.b, r.d, isFlat(P));
    }
  };
}
/* Тело: боковые грани рисуются по одной — ради затенения, — но БЕЗ
   собственной обводки. Обводится только силуэт ленты, иначе на скруглённом
   углу получается частокол штрихов. */
function body(g, P, ring, w0, w1, holes, cls){
  const n = ring.length, vis = visMask(P, ring, w0, w1);
  if(vis){
    const bin = faceBin();
    for(let i=0;i<n;i++){
      if(!vis[i]) continue;
      const a = ring[i], b = ring[(i+1)%n];
      const nn = edgeNormal(a, b, vis.sgn);
      bin.add([pj(P,a[0],a[1],w1), pj(P,b[0],b[1],w1),
               pj(P,b[0],b[1],w0), pj(P,a[0],a[1],w0)], lit(nn[0], nn[1], 0));
    }
    bin.flush(g, P, colorOf(cls.paint, "var(--side)"), cls,
      {"data-paint":cls.paint || null});
  }
  for(const band of sideBands(P, ring, w0, w1))
    el("polygon", {points:pstr(band), fill:"none", stroke:"var(--part-edge)",
      "stroke-width":cls.sw, "stroke-linejoin":"round"}, g);
  let d = "M " + pjRing(P, ring, w1).map(q => fmt(q[0])+" "+fmt(q[1])).join(" L ") + " Z";
  for(const h of (holes || []))
    d += " M " + pjRing(P, h, w1).map(q => fmt(q[0])+" "+fmt(q[1])).join(" L ") + " Z";
  el("path", {d, "fill-rule":"evenodd", fill:colorOf(cls.paint, "var(--part)"),
    stroke:"var(--part-edge)", "stroke-width":cls.sw*1.3, "stroke-linejoin":"round",
    "data-paint":cls.paint || null}, g);
  shade(g, null, lit(0,0,1), d, isFlat(P));
}
/* Выемка рисуется как выемка: сначала дно, потом ВНУТРЕННЯЯ стенка (видны
   грани, отвёрнутые от зрителя — противоположные тем, что видны снаружи), и
   только потом обод. При обратном порядке карман читался шайбой.

   Стенка идёт не одним куском: сначала прямой участок, потом скругление дна
   по дуге — сечение на каждой высоте берётся поджатием контура внутрь. Без
   этого ползунок «скругление дна» менял цифру, а картинка стояла на месте. */
function recessShapes(g, P, shapes, wTop, depth, fil, cls){
  const f = Math.max(0, Math.min(fil, depth*0.92));
  const straight = depth - f;
  const STEPS = f > 0.06 ? 8 : 0;
  const levels = [{w:wTop, ins:0}, {w:wTop - straight, ins:0}];
  for(let k=1;k<=STEPS;k++){
    const a = k*90/STEPS*Math.PI/180;
    levels.push({w:wTop - straight - f*Math.sin(a), ins:f*(1 - Math.cos(a))});
  }
  const rings = levels.map(L => ({w:L.w, r:shapePaths(shapes, 110, L.ins)}));
  const floor = rings[rings.length-1];
  for(const fr of floor.r){
    el("polygon", {points:pstr(pjRing(P, fr, floor.w)), fill:"var(--hollow)",
      stroke:"none"}, g);
    shade(g, pjRing(P, fr, floor.w), lit(0,0,1)*0.82, null, isFlat(P));
  }
  const wallBin = faceBin();
  for(let L=0; L<rings.length-1; L++){
    const A = rings[L], B = rings[L+1];
    if(A.r.length !== B.r.length) continue;
    const tilt = L === 0 ? 0 : (L-0.5)/Math.max(STEPS,1);
    for(let ri=0; ri<A.r.length; ri++){
      const ra = A.r[ri], rb = B.r[ri];
      const vis = visMask(P, ra, B.w, A.w), n = ra.length;
      if(!vis) continue;
      const st = rb.length / n;
      for(let i=0;i<n;i++){
        if(vis[i]) continue;                    // видна ДАЛЬНЯЯ стенка ямы
        const a = ra[i], b = ra[(i+1)%n];
        const a2 = rb[Math.min(Math.round(i*st), rb.length-1)];
        const b2 = rb[Math.min(Math.round(((i+1)%n)*st), rb.length-1)];
        const nn = edgeNormal(a, b, -vis.sgn);
        wallBin.add([pj(P,a[0],a[1],A.w), pj(P,b[0],b[1],A.w),
                     pj(P,b2[0],b2[1],B.w), pj(P,a2[0],a2[1],B.w)],
          lit(nn[0]*(1-tilt), nn[1]*(1-tilt), tilt)*0.94);
      }
    }
  }
  wallBin.flush(g, P, "var(--hollow-side)", cls);
  for(const r of rings[0].r)
    el("polygon", {points:pstr(pjRing(P, r, wTop)), fill:"none", stroke:"var(--accent)",
      "stroke-width":cls.sw*1.2}, g);
}
function disc(g, P, cx, cy, r, w0, w1, cls, fill, edge, top){
  const ring = circlePts(cx, cy, r, 56);
  const vis = visMask(P, ring, w0, w1), n = ring.length;
  if(vis){
    const bin = faceBin();
    for(let i=0;i<n;i++){
      if(!vis[i]) continue;
      const a = ring[i], b = ring[(i+1)%n];
      const nn = edgeNormal(a, b, vis.sgn);
      bin.add([pj(P,a[0],a[1],w1), pj(P,b[0],b[1],w1),
               pj(P,b[0],b[1],w0), pj(P,a[0],a[1],w0)], lit(nn[0], nn[1], 0));
    }
    bin.flush(g, P, "var(--gold-dark)", cls);
  }
  el("polygon", {points:pstr(pjRing(P, ring, w1)), fill:fill, stroke:edge,
    "stroke-width":cls.sw*0.8, opacity:"0.9"}, g);
  shade(g, pjRing(P, ring, w1), lit(0,0,1), null, isFlat(P));
  if(top) el("polygon", {points:pstr(pjRing(P, circlePts(cx,cy,r*0.72,44), w1)),
    fill:"none", stroke:edge, "stroke-width":cls.sw*0.6, opacity:"0.5"}, g);
}
/* Один бочонок петли. Сечение — окружность в плоскости, поперечной оси. */
function knuckle(g, P, axisU, from, to, w, r, cls, alongU, dash, hollow){
  const c = circlePts(axisU, w, r, 26);
  const pts = alongU
    ? c.map(a => pj(P, from, a[0], a[1])).concat(c.map(a => pj(P, to, a[0], a[1])))
    : c.map(a => pj(P, a[0], from, a[1])).concat(c.map(a => pj(P, a[0], to, a[1])));
  el("polygon", {points:pstr(hull2d(pts)),
    fill: hollow ? "none" : "var(--brass-soft)", stroke:"var(--brass)",
    "stroke-width":fmt(cls.sw * (hollow ? 0.85 : 1)),
    opacity: hollow ? "0.6" : null,
    "stroke-dasharray":dash || null, "stroke-linejoin":"round"}, g);
  if(!dash){
    const hi = c.filter(a => a[1] > w + r*0.35);
    if(hi.length > 1){
      const t = alongU ? hi.map(a => pj(P, from, a[0], a[1])).concat(
                         hi.slice().reverse().map(a => pj(P, to, a[0], a[1])))
                       : hi.map(a => pj(P, a[0], from, a[1])).concat(
                         hi.slice().reverse().map(a => pj(P, a[0], to, a[1])));
      el("polygon", {points:pstr(t), fill:"#fff", opacity:"0.22", stroke:"none",
        "pointer-events":"none"}, g);
    }
  }
}
/* Петля целиком: проушины крышки, проушина основания в проёме между ними и
   штифт. Раньше рисовался один сплошной бочонок — на снимках из SolidWorks
   видно, что это три сегмента со стыками, и без них узел не узнаётся. */
function hinge(g, P, m, cls, alongU, crossPos){
  const R = K.knuckle_r, ax = crossPos === undefined ? K.knuckle_x : crossPos, w = m.T;
  const seg = [[0, m.gapLo], [m.barLo, m.barHi], [m.gapHi, m.H]];
  const dash = fmt(cls.sw*4)+" "+fmt(cls.sw*3);
  knuckle(g, P, ax, seg[1][0], seg[1][1], w, R, cls, alongU, dash);
  for(const sg of [seg[0], seg[2]]) knuckle(g, P, ax, sg[0], sg[1], w, R, cls, alongU);
  for(const sg of [seg[0], seg[2]]) knuckle(g, P, ax, sg[0], sg[1], w, R*0.42, cls, alongU);
  // Штифт один и проходит НАСКВОЗЬ все три бочонка. В среднем он спрятан
  // внутри проушины основания — значит, скрытая линия. Без неё петля
  // читалась как три несвязанных бочонка, и было непонятно, чем они держатся.
  knuckle(g, P, ax, seg[1][0], seg[1][1], w, R*0.42, cls, alongU, dash, true);
}
/* Петля, закрытая корпусом. Показывается штриховой — так на чертеже
   показывают то, что лежит за деталью. В закрытом виде бочонки уходят за
   коробку целиком, и без этой линии узел просто пропадал с вида. */
function hingeGhost(g, P, m, cls, alongU, crossPos){
  const R = K.knuckle_r, ax = crossPos === undefined ? K.knuckle_x : crossPos;
  const dash = fmt(cls.sw*3.5)+" "+fmt(cls.sw*2.5);
  for(const sg of [[0, m.gapLo], [m.barLo, m.barHi], [m.gapHi, m.H]])
    knuckle(g, P, ax, sg[0], sg[1], m.T, R, cls, alongU, dash, true);
  knuckle(g, P, ax, 0, m.H, m.T, K.knuckle_r*0.42, cls, alongU, dash, true);
}
/* Смещение оси петли от кромки плиты — общее для всех видов. */
const HINGE_OFF = K.tab_len - K.knuckle_x;
/* Прилив-защёлка у наружного торца крышки. В модели он есть с самого начала,
   но ни на одном виде не рисовался — из-за этого картинка не совпадала с
   оригиналом. Профиль тот же, что в .scad. */
function bossShape(g, P, m, cls, x1){
  const bh = Math.min(8.3, m.H*0.5), bz = m.H/2 - bh/2, by = K.boss_y;
  if(isFlat(P)){
    // На плоском виде объёмный профиль вырождается в отрезок: рисуем след
    // прилива на плане — прямоугольник у наружного торца.
    el("rect", {x:fmt(x1 - 3.3), y:fmt(bz), width:fmt(3.3), height:fmt(bh),
      fill:"var(--part)", stroke:"var(--part-edge)", "stroke-width":fmt(cls.sw),
      "stroke-linejoin":"round"}, g);
    return;
  }
  const prof = [[x1 - 2.4, m.T], [x1, m.T], [x1, m.T + by], [x1 - 2.4, m.T + by],
                [x1 - 3.3, m.T + by*0.811], [x1 - 2.4, m.T + by*0.622]];
  const face = v => prof.map(q => pj(P, q[0], v, q[1]));
  for(let i=0;i<prof.length;i++){
    const a = prof[i], b = prof[(i+1)%prof.length];
    const q = [pj(P,a[0],bz,a[1]), pj(P,b[0],bz,b[1]),
               pj(P,b[0],bz+bh,b[1]), pj(P,a[0],bz+bh,a[1])];
    if(sArea(q) <= 0) continue;
    el("polygon", {points:pstr(q), fill:"var(--side)", stroke:"var(--part-edge)",
      "stroke-width":cls.sw*0.7, "stroke-linejoin":"round"}, g);
    shade(g, q, lit(b[1]-a[1], 0, -(b[0]-a[0])), null, isFlat(P));
  }
  el("polygon", {points:pstr(face(bz + bh)), fill:"var(--part)",
    stroke:"var(--part-edge)", "stroke-width":cls.sw, "stroke-linejoin":"round"}, g);
  shade(g, face(bz + bh), lit(0, -1, 0.2), null, isFlat(P));
}
function hull2d(pts){
  const p = pts.slice().sort((a,b) => a[0]-b[0] || a[1]-b[1]);
  if(p.length < 3) return p;
  const cr = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const half = arr => { const h=[]; for(const q of arr){
    while(h.length>=2 && cr(h[h.length-2],h[h.length-1],q)<=0) h.pop(); h.push(q);} h.pop(); return h; };
  return half(p).concat(half(p.slice().reverse()));
}

/* ===================== общие манипуляторы ===================== */
function coinHandles(P, m, cx, cy, w){
  handle(P, "coin_d", cx + m.cav_r, cy, w, {axis:"u", arrow:"r",
    tip:T_("h_coinD") + " " + fmt(state.coin_d),
    val:() => state.coin_d, set:v => { state.coin_d = clamp(v, 5, 150); },
    move:(d,sn) => { state.coin_d = clamp(q1(sn.coin_d + 2*d, 0.1), 5, 150); }});
}
function sizeHandles(P, m, u0, u1, v1, w){
  handle(P, "case_w", u1, v1/2, w, {axis:"u", tip:T_("h_width") + " " + fmt(m.W),
    val:() => m.W, set:v => { state.case_w = clamp(v, 30, 250); },
    move:(d,sn) => { state.case_w = clamp(q1(sn.case_w + d, 0.5), 30, 250); }});
  handle(P, "case_h", (u0+u1)/2, v1, w, {axis:"v", tip:T_("h_height") + " " + fmt(m.H),
    val:() => m.H, set:v => { state.case_h = clamp(v, 30, 250); },
    move:(d,sn) => { state.case_h = clamp(q1(sn.case_h + d, 0.5), 30, 250); }});
}
function notchHandle(P, m, cx, cy, w, idsuf){
  if(!state.finger_notch_enable) return;
  const half = state.finger_notch_shape === 1 ? state.finger_notch_d/2 : m.fn_r;
  handle(P, "fn_d" + (idsuf||""), cx + half, cy + m.fn_dist, w, {axis:"u", arrow:"r",
    tip:T_("h_notch") + " " + fmt(state.finger_notch_d),
    val:() => state.finger_notch_d, set:v => { state.finger_notch_d = clamp(v, 4, 50); },
    move:(d,sn) => {
      state.finger_notch_d = clamp(q1(sn.finger_notch_d + 2*d, 0.5), 4, 50); }});
}

/* ===================== общая сборка половинок =====================
   Обе половинки, петля, защёлка и монета рисуются одним кодом — и на плане,
   и в изометрии. Раньше это было продублировано, и виды расходились. */
function drawOpenCase(g, P, m, cls){
  const s = state;
  const o1 = plateOutline(m.W, m.H, m.corner_r).map(p => [K.tab_len + p[0], p[1]]);
  const o2 = plateOutline(m.W, m.H, m.corner_r).map(p => [K.wall_x  - p[0], p[1]]);
  const sh2 = cavityShapes(m, m.p2cx, m.cz, true);
  const sh1 = cavityShapes(m, m.p1cx, m.cz, false);
  const cav2 = shapePaths(sh2, 130), cav1 = shapePaths(sh1, 130);

  body(g, P, o2, 0, m.T, cav2, Object.assign({}, cls, {paint:"base"}));
  // Полость и вырезы под пальцы — РАЗНОЙ глубины: вырез уходит ниже дна
  // кармана, чтобы монету можно было поддеть. Раньше всё объединение
  // рисовалось на одну глубину кармана, и вырезы выглядели вровень с дном —
  // ползунок глубины менял цифру, а картинка стояла.
  recessShapes(g, P, sh2, m.T, m.baseD, 0, cls);
  if(s.finger_notch_enable && s.finger_notch_depth > m.baseD + 0.05)
    recessShapes(g, P, cavityShapes(m, m.p2cx, m.cz, true).slice(1),
      m.T, Math.min(s.finger_notch_depth, m.T - 0.2), s.finger_notch_fillet, cls);
  if(s.show_coin){
    if(isFlat(P)){
      // На чертеже монета показывается прозрачным диском: сплошной закрывал
      // и обод полости, и вырезы под пальцы — а именно их и надо видеть.
      el("polygon", {points:pstr(pjRing(P, circlePts(m.p2cx, m.cz, s.coin_d/2, 56), m.T)),
        fill:"var(--gold)", opacity:"0.42", stroke:"var(--gold-edge)",
        "stroke-width":cls.sw, "stroke-dasharray":fmt(cls.sw*4)+" "+fmt(cls.sw*3)}, g);
    } else {
      disc(g, P, m.p2cx, m.cz, s.coin_d/2, m.T - m.baseD,
        m.T - m.baseD + s.coin_t, cls, "var(--gold)", "var(--gold-edge)", true);
    }
    // контур полости поверх монеты: иначе диск съедает и обод, и вырезы
    for(const r of cav2)
      el("polygon", {points:pstr(pjRing(P, r, m.T)), fill:"none", stroke:"var(--accent)",
        "stroke-width":cls.sw*1.2}, g);
  }
  hinge(g, P, m, cls, false);
  body(g, P, o1, 0, m.T, cav1, Object.assign({}, cls, {paint:"lid"}));
  // У кармана крышки вырезов нет — и скругления дна вырезов тоже.
  recessShapes(g, P, sh1, m.T, m.lidD, 0, cls);
  // Прилив есть ТОЛЬКО на крышке — так в модели. На второй половинке его не
  // рисуем: показывать деталь, которой в файле нет, значит врать про печать.
  bossShape(g, P, m, cls, m.p1x1);
}
function caseHandles(P, m, w){
  coinHandles(P, m, m.p1cx, m.cz, w);
  sizeHandles(P, m, m.p1x0, m.p1x1, m.H, w);
  notchHandle(P, m, m.p2cx, m.cz, w);
}

/* ===================== вид сверху: раскрытый кейс ===================== */
function viewTop(host, rect, m){
  // Плоский, без наклона: в режиме трёх видов это чертёж, объём остаётся
  // изометрии. С наклоном тут терялись прямые углы и читать было хуже.
  const P0 = PROJ.flat, pad = m.W*0.09;
  const u0 = m.p2x1 - K.knuckle_r - pad, u1 = m.p1x1 + pad;
  const corners = [];
  for(const u of [u0,u1]) for(const v of [-pad, m.H+pad]) corners.push(pj(P0,u,v,0));
  const P = panel(host, rect, corners, P0, T_("v_top"),
    fmt(2*m.W + (K.tab_len-K.wall_x)) + " × " + fmt(m.H));
  drawOpenCase(P.g, P, m, {sw:(u1-u0)/460});
  caseHandles(P, m, m.T);
  return P;
}

/* ===================== вид сбоку: объёмный срез =====================
   Плоское сечение выпадало из ряда — остальные виды объёмные. Берётся тот же
   честный профиль и выдавливается на небольшую глубину: так срез показывают
   в CAD. Выносных цифр нет намеренно — значения читаются с рукояток. */
function viewCut(host, rect, m){
  const s = state, P0 = PROJ.sect;
  const total = 2*m.T, cx = m.W/2, D = 0;
  // Левый отступ больше: там стоят подписи КРЫШКА/ОСНОВА, и при узком поле
  // их срезало краем панели.
  const padX = m.W*0.13, padXL = m.W*0.34, padY = total*0.30;
  const corners = [];
  for(const u of [-padXL, m.W+padX]) for(const v of [0, D])
    for(const w of [-padY, total+padY]) corners.push(pj(P0,u,v,w));
  const P = panel(host, rect, corners, P0, T_("v_section"), T_("thk")+" "+fmt(total));
  const g = P.g, cls = {sw:m.W/300};
  const pd = Math.min(m.lidD, m.T), bpd = Math.min(m.baseD, m.T);

  const lid = [[0,0],[m.W,0],[m.W,m.T],[cx+m.cav_r,m.T],[cx+m.cav_r,m.T-pd],
               [cx-m.cav_r,m.T-pd],[cx-m.cav_r,m.T],[0,m.T]];
  const base = [[0,total],[m.W,total],[m.W,m.T],[cx+m.cav_r,m.T],[cx+m.cav_r,m.T+bpd],
                [cx-m.cav_r,m.T+bpd],[cx-m.cav_r,m.T],[0,m.T]];
  const slab = (prof, dir) => {
    el("polygon", {points:pstr(prof.map(q => pj(P0, q[0], D, q[1]))), fill:"var(--side)",
      stroke:"var(--part-edge)", "stroke-width":cls.sw*0.8, "stroke-linejoin":"round"}, g);
    const n = prof.length;
    for(let i=0;i<n;i++){
      const a = prof[i], b = prof[(i+1)%n];
      const q = [pj(P0,a[0],0,a[1]), pj(P0,b[0],0,b[1]),
                 pj(P0,b[0],D,b[1]), pj(P0,a[0],D,a[1])];
      if(sArea(q) <= 0) continue;
      el("polygon", {points:pstr(q), fill:"var(--side)", stroke:"none"}, g);
      shade(g, q, lit(-(b[1]-a[1]), 0, (b[0]-a[0])));
    }
    const near = prof.map(q => pj(P0, q[0], 0, q[1]));
    el("polygon", {points:pstr(near), fill:"var(--cut)", stroke:"var(--part-edge)",
      "stroke-width":cls.sw*1.3, "stroke-linejoin":"round"}, g);
    shade(g, near, lit(0,-1,0));
    hatch(g, near, dir, m.W/26, cls);
  };
  slab(base, 1); slab(lid, -1);
  if(s.show_coin){
    const cb = m.T + bpd, ct = cb - Math.min(s.coin_t, bpd + pd);
    const cp = [[cx-s.coin_d/2, ct],[cx+s.coin_d/2, ct],[cx+s.coin_d/2, cb],[cx-s.coin_d/2, cb]];
    el("polygon", {points:pstr(cp.map(q => pj(P0,q[0],D*0.55,q[1]))), fill:"var(--gold-dark)",
      stroke:"none"}, g);
    el("polygon", {points:pstr(cp.map(q => pj(P0,q[0],0,q[1]))), fill:"var(--gold)",
      stroke:"var(--gold-edge)", "stroke-width":cls.sw}, g);
  }
  el("line", {x1:fmt(pj(P0,0,0,m.T)[0]), y1:fmt(pj(P0,0,0,m.T)[1]),
    x2:fmt(pj(P0,m.W,0,m.T)[0]), y2:fmt(pj(P0,m.W,0,m.T)[1]),
    stroke:"var(--line)", "stroke-width":cls.sw,
    "stroke-dasharray":fmt(cls.sw*5)+" "+fmt(cls.sw*4)}, g);

  // ——— петля ————————————————————————————————————————————————————————
  // Секущая плоскость идёт по середине высоты, а там сидит проушина
  // ОСНОВАНИЯ — значит, и бочонок, и штифт попадают в разрез. До этого
  // петли на сечении не было вовсе, хотя на всех остальных видах она есть.
  const ringAt = (r, n) => pstr(circlePts(-HINGE_OFF, m.T, r, n || 40)
    .map(q => pj(P0, q[0], D, q[1])));
  el("polygon", {points:ringAt(K.knuckle_r), fill:"var(--brass-soft)",
    stroke:"var(--brass)", "stroke-width":fmt(cls.sw*1.2)}, g);
  el("polygon", {points:ringAt(1.65, 28), fill:"var(--brass)",
    stroke:"var(--brass)", "stroke-width":fmt(cls.sw*0.7)}, g);

  // ——— скрытые линии ————————————————————————————————————————————————
  const hidden = prof => el("polyline",
    {points:pstr(prof.map(q => pj(P0, q[0], D, q[1]))), fill:"none",
     stroke:"var(--ink-dim)", "stroke-width":fmt(cls.sw*0.9), opacity:"0.65",
     "stroke-dasharray":fmt(cls.sw*4)+" "+fmt(cls.sw*3),
     "stroke-linejoin":"round", "stroke-linecap":"round"}, g);
  if(s.finger_notch_enable){
    // Вырезы под пальцы стоят на ободе полости, то есть перед секущей
    // плоскостью и за ней — в разрез они не попадают. Показаны штриховой:
    // иначе по сечению нельзя понять, насколько они глубже кармана.
    const nd = Math.min(s.finger_notch_depth, m.T - 0.2);
    const fr = Math.max(0, Math.min(s.finger_notch_fillet, m.fn_r*0.95, nd*0.95));
    const bot = m.T + nd, prof = [[cx - m.fn_r, m.T]];
    for(let k=0;k<=8;k++){ const a = k*Math.PI/16;
      prof.push([cx - m.fn_r + fr*(1-Math.cos(a)), bot - fr*(1-Math.sin(a))]); }
    for(let k=8;k>=0;k--){ const a = k*Math.PI/16;
      prof.push([cx + m.fn_r - fr*(1-Math.cos(a)), bot - fr*(1-Math.sin(a))]); }
    prof.push([cx + m.fn_r, m.T]);
    hidden(prof);
  }

  // ——— прилив-защёлка ———————————————————————————————————————————————
  // Стоит по середине высоты, ровно там, где проходит секущая плоскость,
  // поэтому попадает в разрез. Профиль — тот же, что в .scad.
  {
    const by = K.boss_y;
    const bp = [[m.W - 2.4, m.T], [m.W, m.T], [m.W, m.T + by], [m.W - 2.4, m.T + by],
                [m.W - 3.3, m.T + by*0.811], [m.W - 2.4, m.T + by*0.622]];
    const bpp = bp.map(q => pj(P0, q[0], D, q[1]));
    el("polygon", {points:pstr(bpp), fill:"var(--cut)", stroke:"var(--part-edge)",
      "stroke-width":fmt(cls.sw*1.3), "stroke-linejoin":"round"}, g);
    hatch(g, bpp, -1, m.W/26, cls);   // штриховка крышки: прилив — её деталь
  }
  const lab = (w, t) => { const q = pj(P0, -(HINGE_OFF + K.knuckle_r + m.W*0.035), 0, w);
    const n = el("text", {x:fmt(q[0]), y:fmt(q[1]), fill:"var(--ink-dim)",
      "font-size":fmt(m.W*0.048), "text-anchor":"end", "dominant-baseline":"central",
      "font-family":"IBM Plex Sans, sans-serif"}, g); n.textContent = t; };
  lab(m.T*0.5, T_("lid"));
  lab(m.T*1.5, T_("base"));

  handle(P, "lidD", cx - m.cav_r*0.72, 0, m.T - pd, {axis:"w", arrow:"v",
    val:() => m.lidD, set:v => { state.lid_extra = clamp(v - m.lidAuto, -10, 25); },
    tip:T_("h_lidD")+" "+fmt(m.lidD), move:(d,sn) => {
      state.lid_extra = clamp(q1(sn.lid_extra - d, 0.1), -10, 25); }});
  handle(P, "baseD", cx + m.cav_r*0.72, 0, m.T + bpd, {axis:"w", arrow:"v",
    val:() => m.baseD, set:v => { state.base_extra = clamp(v - m.baseAutoD, -10, 25); },
    tip:T_("h_baseD")+" "+fmt(m.baseD), move:(d,sn) => {
      state.base_extra = clamp(q1(sn.base_extra + d, 0.1), -10, 25); }});
  handle(P, "case_t", m.W*0.14, 0, total, {axis:"w", arrow:"v",
    val:() => m.T, set:v => { state.case_t = clamp(v, 4, 50); },
    tip:T_("h_caseT")+" "+fmt(m.T), move:(d,sn) => {
      state.case_t = clamp(q1(sn.case_t + d/2, 0.5), 4, 50); }});
  if(s.show_coin)
    handle(P, "coin_t", cx + s.coin_d*0.3, 0, m.T + bpd - Math.min(s.coin_t, bpd+pd),
      {axis:"w", arrow:"v", val:() => s.coin_t,
       set:v => { state.coin_t = clamp(v, 0.3, 25); },
       tip:T_("h_coinT")+" "+fmt(s.coin_t), move:(d,sn) => {
         state.coin_t = clamp(q1(sn.coin_t + d, 0.1), 0.3, 25); }});
  return P;
}

/* ===================== изометрия ===================== */
function isoCorners(m, closed, pad){
  const P0 = PROJ.iso, c = [];
  // В закрытом виде петля выходит за кромку плиты — её надо учесть в
  // габаритах, иначе бочонки упираются в край панели и вид смещён.
  if(closed){ for(const a of [-pad, m.H+pad])
      for(const b of [-(HINGE_OFF + K.knuckle_r + pad), m.W+pad])
      for(const w of [0, 2*m.T]) c.push(pj(P0,a,b,w)); }
  else { for(const u of [m.p2x1-K.knuckle_r-pad, m.p1x1+pad])
      for(const v of [-pad, m.H+pad]) for(const w of [0, m.T+K.boss_y]) c.push(pj(P0,u,v,w)); }
  return c;
}
function drawClosedCase(g, P, m, cls){
  // Плита развёрнута на 180°: петля сверху, скругления снизу. Надпись при
  // этом остаётся читаемой — в модели она повёрнута ровно на те же 180°,
  // так что физически это одна и та же деталь.
  const o = plateOutline(m.W, m.H, m.corner_r).map(p => [m.H - p[1], p[0]]);
  // Петля рисуется ПЕРВОЙ и оказывается за корпусом: она сидит на уровне
  // стыка, то есть ниже верхней грани, и должна быть закрыта коробкой.
  // Снаружи остаётся только та часть бочонка, что выступает за силуэт —
  // раньше петля рисовалась последней и просвечивала сквозь крышку.
  hinge(g, P, m, cls, true, -HINGE_OFF);
  body(g, P, o, 0, 2*m.T, null, Object.assign({}, cls, {paint:"lid"}));
  // Линия стыка половинок — без неё коробка читается монолитом. Рисуется
  // ТОЛЬКО по видимым боковым граням: полный контур на уровне стыка ложился
  // призрачной линией поперёк верхней грани, где никакого стыка не видно.
  for(const [st, len] of visibleRuns(P, o, 0, 2*m.T)){
    const pts = [];
    for(let k=0;k<=len;k++){ const q = o[(st+k)%o.length];
      pts.push(pj(P, q[0], q[1], m.T)); }
    el("polyline", {points:pstr(pts), fill:"none", stroke:"var(--part-edge)",
      "stroke-width":cls.sw*0.9, opacity:"0.8"}, g);
  }
  // С этой точки петля уходит за коробку, наружу выходит только краешек у
  // угла. Раньше на его месте оставалось непонятное пятно; теперь рядом
  // идёт скрытая линия, и видно, что это петля вдоль всей задней кромки.
  hingeGhost(g, P, m, cls, true, -HINGE_OFF);
  drawEngraving(el("g", {transform:faceMatrix(PROJ.iso, m)}, g), m);
}
function viewIso(host, rect, m, compact){
  const open = isoMode === "open" && !compact;
  const P0 = PROJ.iso, pad = m.W*0.07;
  const P = panel(host, rect, isoCorners(m, !open, pad), P0,
    T_(open ? "v_iso_open" : "v_iso_closed"),
    compact ? null : (state.show_coin ? T_("with_coin") : null));
  const cls = {sw:(m.W*2)/470};
  if(open){
    drawOpenCase(P.g, P, m, cls);
    if(!compact){
      caseHandles(P, m, m.T);
      handle(P, "lidD_iso", m.p1cx - m.cav_r*0.45, m.cz, m.T - m.lidD, {axis:"w", arrow:"v",
        val:() => m.lidD, set:v => { state.lid_extra = clamp(v - m.lidAuto, -10, 25); },
        tip:T_("h_lidD")+" "+fmt(m.lidD), move:(d,sn) => {
          state.lid_extra = clamp(q1(sn.lid_extra + d, 0.1), -10, 25); }});
      handle(P, "baseD_iso", m.p2cx - m.cav_r*0.45, m.cz, m.T - m.baseD, {axis:"w", arrow:"v",
        val:() => m.baseD, set:v => { state.base_extra = clamp(v - m.baseAutoD, -10, 25); },
        tip:T_("h_baseD")+" "+fmt(m.baseD), move:(d,sn) => {
          state.base_extra = clamp(q1(sn.base_extra + d, 0.1), -10, 25); }});

/* ===================== гравировка =====================
   Экранная система: sx вправо вдоль строк, sy вверх поперёк. Блок упирается

  const s = state, L = layoutText(m), n = L.lines.length;
  const halfLine = L.widest/2, halfStack = n*L.pitch/2;
  const lzLo = m.margin + halfLine, lzHi = m.H - m.margin - halfLine;
  const sxLo = m.p1x0 + m.margin + halfStack, sxHi = m.p1x1 - m.margin - halfStack;
  const lineZ = clamp(m.cz - s.text_shift_h, lzLo, Math.max(lzLo, lzHi));
  const stackX = clamp(m.p1cx + s.text_shift_v - L.iconRes/2, sxLo, Math.max(sxLo, sxHi));
  const ih = s.icon_size/2;
  const ix = clamp(stackX + halfStack + s.icon_size*0.6 + s.icon_shift_v,
    m.p1x0 + m.margin + ih, Math.max(m.p1x0 + m.margin + ih, m.p1x1 - m.margin - ih));
  const iz = clamp(lineZ - s.icon_shift_h, m.margin + ih,
    Math.max(m.margin + ih, m.H - m.margin - ih));

          sxIcon:m.cz - iz, syIcon:m.p1cx - ix};

/* Надпись рисуется ВСЕГДА в своих плоских координатах, а на грань попадает

   поворотом по отдельности — буквы оставались в экранной плоскости и
   читались как наклейка поверх коробки, а сама матрица была подобрана на

  for(let i=0;i<E.n;i++){

      "text-anchor":"middle", "dominant-baseline":"central", "font-family":f.css,
      "font-weight":f.w, "font-size":fmt(em),

    t.textContent = E.L.lines[i];

  return E;
}
function faceMatrix(P, m){
  const o = pj(P, m.H/2, m.W/2, 2*m.T);

/* =====================================================================
   3D-ПРОСМОТРЩИК
   Меш собирается прямо на странице, а не настоящим OpenSCAD: движок под
   WebAssembly считает одну половинку около двадцати пяти секунд, и «покрутить
   модель» с такой задержкой не получается. Здесь пересчёт занимает
   миллисекунды и идёт прямо под пальцем.

   Мерилом остаются чертёжные виды и сам .scad — в файл уходит именно он.
   В 3D допущены упрощения: буквы обводятся по растру, а не по контурам
   шрифта, скругление дна вырезов набирается ступенями. На печатаемый файл
   это не влияет никак.

   Оси здесь модельные: x — вдоль ширины, y — толщина (вверх), z — вдоль
   высоты плиты. Плоские грани лежат в плоскости xz, как в .scad.

/* ---------- кольца ---------- */
function ringClean(r){
  const out = [];
  for(const p of r){
    const q = out[out.length-1];
    if(!q || Math.abs(q[0]-p[0]) > 1e-9 || Math.abs(q[1]-p[1]) > 1e-9) out.push([p[0], p[1]]);
  }
  if(out.length > 2){
    const a = out[0], b = out[out.length-1];
    if(Math.abs(a[0]-b[0]) < 1e-9 && Math.abs(a[1]-b[1]) < 1e-9) out.pop();
  }
  return out;
}
function ringBBox(r){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of r){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0];
                     if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  return [x0,y0,x1,y1];
}
/* Равномерная переразбивка по длине. Нужна, чтобы соединять стенкой два
   контура с разным числом точек — например обод кармана и его фаску. */
function resample(r, n){
  const m = r.length; if(m < 3) return r;
  const cum = new Float64Array(m+1);
  for(let i=0;i<m;i++){ const a = r[i], b = r[(i+1)%m];
    cum[i+1] = cum[i] + Math.hypot(b[0]-a[0], b[1]-a[1]); }
  const L = cum[m]; if(!(L > 1e-9)) return r;
  const out = []; let j = 0;
  for(let k=0;k<n;k++){
    const t = k*L/n;
    while(j < m-1 && cum[j+1] < t) j++;
    const a = r[j], b = r[(j+1)%m], d = cum[j+1] - cum[j];
    const u = d > 1e-12 ? (t - cum[j])/d : 0;
    out.push([a[0] + (b[0]-a[0])*u, a[1] + (b[1]-a[1])*u]);
  }

}
const ringOrient = (r, ccw) => (sArea(r) > 0) === !!ccw ? r.slice() : r.slice().reverse();
function ptInRing(p, r){
  let inside = false;
  for(let i=0, j=r.length-1; i<r.length; j=i++){
    const a = r[i], b = r[j];
    if((a[1] > p[1]) !== (b[1] > p[1]) &&
       p[0] < (b[0]-a[0])*(p[1]-a[1])/((b[1]-a[1]) || 1e-12) + a[0]) inside = !inside;
  }
  return inside;
}
/* Марширующие квадраты выдают все контуры вперемешку: и наружные, и дырки.
   Раскладываем их по вложенности — чётная глубина значит наружный. */
function groupRings(rings){
  const rs = rings.map(ringClean).filter(r => r.length > 2);
  const dep = rs.map(r => rs.reduce((n, o) => n + (o !== r && ptInRing(r[0], o) ? 1 : 0), 0));
  const out = [];
  rs.forEach((r, i) => { if(dep[i] % 2 === 0) out.push({outer:r, holes:[]}); });
  rs.forEach((r, i) => {
    if(dep[i] % 2 === 0) return;
    let best = null, bestA = Infinity;
    for(const g of out) if(ptInRing(r[0], g.outer)){
      const a = Math.abs(sArea(g.outer)); if(a < bestA){ bestA = a; best = g; } }
    (best || out[0] || {holes:[]}).holes.push(r);
  });

/* ---------- триангуляция плоской грани ---------- */
const segHit = (p1,p2,p3,p4) => {
  const d = (a,b,c) => (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
  const d1 = d(p3,p4,p1), d2 = d(p3,p4,p2), d3 = d(p1,p2,p3), d4 = d(p1,p2,p4);
  return ((d1>0) !== (d2>0)) && ((d3>0) !== (d4>0));
};
/* Дырка врезается в контур мостом: от её самой левой точки к ближайшей
   видимой вершине контура и обратно. Отрезок, который ни одно ребро не
   пересекает, целиком лежит внутри — отдельная проверка не нужна. */
function bridgeHole(poly, hole, others){
  let hi = 0;
  for(let i=1;i<hole.length;i++) if(hole[i][0] < hole[hi][0]) hi = i;
  const H = hole[hi];
  const order = poly.map((p,i) => [i, (p[0]-H[0])*(p[0]-H[0]) + (p[1]-H[1])*(p[1]-H[1])])
                    .sort((a,b) => a[1] - b[1]);
  const tries = Math.min(order.length, 60);
  for(let t=0; t<tries; t++){
    const pi = order[t][0], P = poly[pi];
    let ok = true;
    for(let i=0; i<poly.length && ok; i++){
      const a = poly[i], b = poly[(i+1)%poly.length];
      if(a === P || b === P) continue;
      if(segHit(P, H, a, b)) ok = false;
    }
    for(let i=0; i<hole.length && ok; i++){
      const a = hole[i], b = hole[(i+1)%hole.length];
      if(a === H || b === H) continue;
      if(segHit(P, H, a, b)) ok = false;
    }
    for(const o of others){
      if(!ok) break;
      for(let i=0;i<o.length;i++) if(segHit(P, H, o[i], o[(i+1)%o.length])){ ok = false; break; }
    }
    if(!ok) continue;

      .concat(hole.slice(hi), hole.slice(0, hi+1), poly.slice(pi));
  }
  return null;
}
function earClip(P){
  const n = P.length; if(n < 3) return [];
  const idx = []; for(let i=0;i<n;i++) idx.push(i);
  const tris = [], sgn = sArea(P) > 0 ? 1 : -1;
  /* Строго ВНУТРИ, край не считается. Мост в дырку идёт двумя совпадающими
     рёбрами: вершина моста лежит ровно на границе уха, и при нестрогой
     проверке она блокировала отсечение — контур вставал на месте, а грань
     оставалась наполовину непокрытой. */

    const s1 = (p[0]-b[0])*(a[1]-b[1]) - (a[0]-b[0])*(p[1]-b[1]);
    const s2 = (p[0]-c[0])*(b[1]-c[1]) - (b[0]-c[0])*(p[1]-c[1]);
    const s3 = (p[0]-a[0])*(c[1]-a[1]) - (c[0]-a[0])*(p[1]-a[1]);
    return (s1 > 0 && s2 > 0 && s3 > 0) || (s1 < 0 && s2 < 0 && s3 < 0);
  };
  let k = 0, miss = 0, eps = 1e-11;
  while(idx.length > 3){
    const L = idx.length;
    if(miss > L){
      // Застряли. У трассированного контура сотни почти коллинеарных вершин,
      // и на них «ухо» получается вырожденным. Один раз ослабляем требование
      // к выпуклости и идём дальше: пара плоских треугольников на грани
      // ничему не мешает, а брошенный кусок оставлял в ней дыру, сквозь
      // которую просвечивала гравировка с обратной стороны.
      if(eps > -1e-9){ eps = -1e-9; miss = 0; } else break;
    }
    const i0 = idx[(k-1+L)%L], i1 = idx[k%L], i2 = idx[(k+1)%L];
    const a = P[i0], b = P[i1], c = P[i2];
    const cr = ((b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0])) * sgn;
    let ear = cr > eps;
    // Смотрим только вогнутые вершины: выпуклая внутрь уха попасть не может.
    if(ear) for(let j=0;j<L;j++){

    if(ear){ tris.push([i0,i1,i2]); idx.splice(k%L, 1); k = k % Math.max(idx.length,1); miss = 0; }

/* Контур с дырками в треугольники. Много дырок сразу — дорого (отсечение
   ушей квадратично), поэтому область сначала режется по просветам между
   дырками: у строк текста просветы есть и между строками, и между буквами,
   так что на каждый кусок остаётся две-три дырки. */

    else merged.push([v[0], v[1]]);

  let best = null, bw = 1e-4;
  for(let i=0;i+1<merged.length;i++){
    const w = merged[i+1][0] - merged[i][1];
    if(w > bw){ bw = w; best = (merged[i][1] + merged[i+1][0])/2; }

  const hs = (holes || []).map(h => ringOrient(ringClean(h), false)).filter(h => h.length > 2);
  hs.sort((a,b) => ringBBox(a)[0] - ringBBox(b)[0]);
  for(let i=0;i<hs.length;i++){

function rayHit(ring, cx, cy, ux, uy){
  const n = ring.length; let best = -1;

    const ex = b[0]-a[0], ey = b[1]-a[1];
    const den = ux*ey - uy*ex;
    if(Math.abs(den) < 1e-12) continue;
    const t = ((a[0]-cx)*ey - (a[1]-cy)*ex)/den;   // вдоль луча
    const s = ((a[0]-cx)*uy - (a[1]-cy)*ux)/den;   // вдоль ребра

/* Плоское кольцо: наружный контур и ОДНА дырка. Обе фигуры звёздчатые

function annulusFace(outer, hole, n){

    if(!(t1 > 0) || !(t2 >= 0) || t2 >= t1 - 1e-9) return null;   // не звёздчато
