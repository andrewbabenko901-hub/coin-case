<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coin Case Rig</title>
<meta name="description" content="Параметрический шарнирный кейс для монеты: размеры, гравировка и готовые файлы для печати.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129689;</text></svg>">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Coin Case Rig</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#E4E8E7;
  --panel:#FFFFFF;
  --panel-2:#EFF3F2;
  --line:#C3CCCA;
  --line-soft:#DCE3E1;
  --ink:#0D1416;
  --ink-2:#33474A;
  --ink-dim:#5F7375;
  --accent:#0E6560;
  --accent-2:#12857E;
  --accent-soft:#CFE6E3;
  --brass:#8A6216;
  --brass-soft:#EFDFBB;
  --danger:#9C3423;
  --coin:#6E7C85;
  --gold:#D8A93C;--gold-dark:#A97F22;--gold-edge:#7A5A16;
  --side:#E4EAEA;--hollow:#D2E4E1;--hollow-side:#BBD4D0;--tipbg:#FFFFFFEE;
  --cut:#DCE4E4;
  --part:#F7FAF9;
  --part-edge:#243437;
  --shadow:0 1px 2px rgba(13,20,22,.07),0 10px 26px -14px rgba(13,20,22,.32);
  --r:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A1012;--panel:#141B1D;--panel-2:#1A2325;--line:#313E40;--line-soft:#242F31;
    --ink:#EAF0EF;--ink-2:#BCC9C8;--ink-dim:#8A9C9A;--accent:#54CFC4;--accent-2:#7FE0D7;
    --accent-soft:#123634;--brass:#DCAE4F;--brass-soft:#3A2D14;--danger:#E8806C;
    --coin:#93A2AB;--part:#212B2D;--part-edge:#C9D6D5;
    --gold:#E8C061;--gold-dark:#A9873A;--gold-edge:#F0D28C;
    --side:#182022;--hollow:#16302E;--hollow-side:#102422;--tipbg:#0E1618EE;
    --cut:#1E282A;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0A1012;--panel:#141B1D;--panel-2:#1A2325;--line:#313E40;--line-soft:#242F31;
  --ink:#EAF0EF;--ink-2:#BCC9C8;--ink-dim:#8A9C9A;--accent:#54CFC4;--accent-2:#7FE0D7;
  --accent-soft:#123634;--brass:#DCAE4F;--brass-soft:#3A2D14;--danger:#E8806C;
  --coin:#93A2AB;--part:#212B2D;--part-edge:#C9D6D5;
  --gold:#E8C061;--gold-dark:#A9873A;--gold-edge:#F0D28C;
  --side:#182022;--hollow:#16302E;--hollow-side:#102422;--tipbg:#0E1618EE;
  --cut:#1E282A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);overflow:hidden;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
.app{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:10px}

/* ---------------- top bar ---------------- */
.bar{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.brand span{font-weight:400;color:var(--ink-dim);font-size:11.5px;margin-left:8px}
.chips{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.chips div{padding:5px 11px;border-right:1px solid var(--line-soft)}
.chips div:last-child{border-right:0}
.chips .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.chips .v{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.2}
.chips .v.auto{color:var(--accent)}
.bar .right{margin-left:auto;display:flex;gap:7px}

/* ---------------- layout ---------------- */
.body{flex:1;min-height:0;display:grid;gap:10px;
  grid-template-columns:250px minmax(0,1fr) 250px}
@media (max-width:1180px){
  body{overflow:auto}
  .app{height:auto}
  .body{grid-template-columns:1fr 1fr}
  .stage{grid-column:1/-1;order:-1;height:66vh}
}
@media (max-width:720px){.body{grid-template-columns:1fr}}

.rail{--k:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:calc(7px*var(--k));
  padding-right:2px;scrollbar-width:thin}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);flex:0 0 auto}
.card>h2{margin:0;padding:calc(7px*var(--k)) calc(10px*var(--k));font-size:calc(11px*var(--k));border-bottom:1px solid var(--line-soft);
  font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:2px;background:var(--accent);flex:none}
.dot.b{background:var(--brass)}
.card>.in{padding:calc(8px*var(--k)) calc(10px*var(--k)) calc(10px*var(--k));
  display:flex;flex-direction:column;gap:calc(8px*var(--k))}

/* ---------------- fields ---------------- */
.f{display:flex;flex-direction:column;gap:3px}
.f .top{display:flex;align-items:center;gap:6px}
.f .pic{flex:none;width:calc(24px*var(--k));height:calc(16px*var(--k));opacity:.9}
.f label{font-size:calc(11.5px*var(--k));color:var(--ink-2);flex:1;line-height:1.3}
.f .num{font-family:"IBM Plex Mono",monospace;font-size:calc(12px*var(--k));font-weight:600;
  font-variant-numeric:tabular-nums}
.f .num.auto{color:var(--accent)}
.f .u{font-family:"IBM Plex Mono",monospace;font-size:calc(9.5px*var(--k));color:var(--ink-dim)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:calc(14px*var(--k));
  background:transparent;margin:0;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--accent);border:2px solid var(--panel);margin-top:-5px;
  box-shadow:0 0 0 1px var(--accent)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;
  background:var(--accent);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
input[type=text],select{width:100%;padding:5px 7px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel-2);color:var(--ink);font-family:inherit;font-size:12px}
input[type=text]{font-family:"IBM Plex Mono",monospace;font-size:11.5px}
input[type=text]:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
select{cursor:pointer}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:11.5px;color:var(--ink-2)}
.chk input{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex:none}
.note{font-size:calc(10px*var(--k));line-height:1.32;color:var(--ink-dim);
  border-left:2px solid var(--line);padding-left:7px}
.note.w{color:var(--brass);border-color:var(--brass)}
.note b{font-family:"IBM Plex Mono",monospace;font-weight:600}

/* ---------------- buttons ---------------- */
.palwrap{display:flex;flex-direction:column;gap:2px;align-items:flex-start;margin-right:4px}
.palette{display:flex;gap:3px;align-items:center}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);padding:0;
  cursor:pointer;background:transparent}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.sw.erase{position:relative;background:var(--panel)}
.sw.erase::after{content:"";position:absolute;inset:3px;border-top:1.5px solid var(--ink-dim);
  transform:rotate(-45deg)}
.swpick{width:18px;height:18px;padding:0;border:1px solid var(--line);border-radius:4px;
  background:var(--panel);cursor:pointer}
.palhint{font-size:9px;color:var(--ink-dim);letter-spacing:.02em;max-width:190px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.painting .canvas{cursor:crosshair}
.langsel{appearance:none;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);font:inherit;font-size:12px;padding:6px 24px 6px 9px;border-radius:8px;
  cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),
  linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat}
/* Снимки в инструкции: стрелки лежат отдельным слоем поверх картинки,
   поэтому подписи переводятся вместе с интерфейсом. */
.stlrow{display:flex;gap:8px;flex-wrap:wrap}
.stlrow .btn:disabled{opacity:.45;cursor:default}
/* Холст 3D лежит поверх svg ровно на месте своей панели: остальные окошки
   рисуются как обычно, а объём выводит WebGL. */
#gl3{position:absolute;left:0;top:0;border-radius:8px;touch-action:none;
  cursor:grab;display:block;z-index:2}
#gl3:active{cursor:grabbing}
body.painting #gl3{cursor:crosshair}
.picbody{display:flex;gap:16px;flex-wrap:wrap}
/* Ползунки в этом окне шли вплотную: подпись следующего налезала на дорожку
   предыдущего, а «Инвертировать» упирался в последний ползунок. */
.picbody .f{margin-bottom:12px}
.picbody .f:has(.chk){margin-top:4px}
.piccol{flex:1 1 260px;min-width:240px;display:flex;flex-direction:column}
.picdrop{position:relative;border:1.5px dashed var(--line);border-radius:10px;
  padding:22px 12px;text-align:center;color:var(--ink-dim);font-size:12px;
  background:var(--panel-2)}
.picdrop:hover{border-color:var(--accent)}
.picfile{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.picprev{margin-top:10px;height:210px;display:grid;place-items:center;
  border:1px solid var(--line-soft);border-radius:10px;background:var(--panel-2);
  position:relative;overflow:hidden}
.picprev>*{grid-area:1/1}
.picsrc{max-width:100%;max-height:200px;opacity:.22;filter:grayscale(1)}
.picsvg{width:100%;height:100%;max-height:200px;position:relative}
#picApply{margin-left:auto}
#picApply:disabled{opacity:.45;cursor:default}
.shot{margin:10px 0 2px;position:relative;line-height:0;border:1px solid var(--line);
  border-radius:8px;overflow:hidden;background:var(--panel-2)}
.shot img{width:100%;height:auto;display:block}
.shot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shot .sa{fill:none;stroke:var(--brass);stroke-width:1.6px;vector-effect:non-scaling-stroke}
.shot .st{fill:var(--brass);font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:2.2px;font-weight:600;paint-order:stroke;stroke:var(--panel);
  stroke-width:1.4px;stroke-linejoin:round}
.btn{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  color:var(--ink);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;
  white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}

.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);
  border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;padding:4px 9px;border:0;border-radius:5px;background:transparent;
  cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:500;color:var(--ink-dim);
  white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.seg button svg{vertical-align:-3px;margin-right:5px}
.seg button[aria-pressed="true"] svg .a{fill:var(--accent);stroke:var(--accent)}

/* ---------------- stage ---------------- */
.stage{min-height:0;display:flex;flex-direction:column;gap:8px}
.stagebar{display:flex;align-items:center;gap:8px;flex:none}
.stagebar .seg{flex:0 1 auto}
.canvas{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;
  -webkit-user-select:none;user-select:none}
/* Промах мимо кружка попадал в подпись на чертеже, и вместо перетаскивания
   начиналось выделение текста. Ни подписи, ни размеры мышью не ловятся.

   И отдельно: мышь ловят ТОЛЬКО крашеные грани и рукоятки. Всё остальное —
   дно карманов, светотень, монета, петля — прозрачно для курсора. Иначе клик
   по крышке попадал в лежащее сверху дно кармана, у которого никакого цвета
   нет, и заливка молча ничего не делала. */
#view text,#view .hcap,#view .htip{-webkit-user-select:none;user-select:none}
/* Гасим мышь у самих фигур, а НЕ у групп: pointer-events:none на <g> в SVG
   гасит и потомков, поэтому крашеные грани переставали ловиться вовсе. */
#view polygon,#view path,#view rect,#view line,#view polyline,#view circle,
#view text{pointer-events:none}
#view [data-paint],#view .hhit,#view .grip{pointer-events:all}
.hint{flex:none;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-dim);
  min-height:17px}
/* Настройки текста живут прямо под своей проекцией, а не в боковой панели:
   так их не приходится искать прокруткой, и правишь надпись, глядя на неё. */
.ctx{flex:none;display:flex;flex-direction:column;gap:8px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;box-shadow:var(--shadow)}
.ctx[hidden]{display:none}
.ctxrow{display:flex;align-items:flex-end;gap:9px}
.ctx .lines{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ctx .opts{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}
.ctx .f label{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim)}
.ctx .f .top label{text-transform:none;letter-spacing:0;font-size:11px}
.ctx .pic{display:none}
.hint .lg{display:inline-flex;align-items:center;gap:5px}
.hint i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* handles */
.hnd{fill:var(--panel);stroke:var(--accent);stroke-width:1.8px;cursor:grab;
  vector-effect:non-scaling-stroke;pointer-events:none}
.hnd.on{fill:var(--accent-soft)}
.hhit{cursor:grab}
.hhit:hover+.hnd{fill:var(--accent-soft)}
.harr{fill:none;stroke:var(--accent);stroke-width:0.24;stroke-linecap:round;
  stroke-linejoin:round}
.htip{fill:var(--ink);font-family:"IBM Plex Mono",monospace;dominant-baseline:hanging}
.hedit{position:fixed;z-index:80;width:92px;padding:5px 8px;border-radius:7px;
  border:1px solid var(--accent);background:var(--panel);color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-size:13px;box-shadow:var(--shadow);
  outline:none;text-align:right}
/* Обязательно по типу И классу: одиночный .hedit проигрывает правилу
   input[type=text]{width:100%} — из-за этого поле разъезжалось во всю ширину. */
input[type=text].hedit{width:96px;padding:5px 8px;font-size:13px}
.hcap{fill:var(--accent);font-family:"IBM Plex Mono",monospace;pointer-events:none}
.grip{fill:none;stroke:var(--accent);stroke-dasharray:4 3;stroke-width:1.2px;
  vector-effect:non-scaling-stroke;cursor:move}

/* ---------------- dialogs ---------------- */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);
  padding:0;max-width:min(920px,94vw);width:100%;max-height:88dvh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(6,12,13,.55)}
.dhead{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.dhead h3{margin:0;font-size:15px;font-weight:600}
.dhead .btn{margin-left:auto}
.dbody{padding:14px 16px 18px;overflow-y:auto;max-height:calc(88dvh - 58px)}
.filegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.fbtn{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:9px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);
  cursor:pointer;font-family:inherit;text-align:left}
.fbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.fbtn[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fbtn .t{font-size:12.5px;font-weight:600}
.fbtn .d{font-size:10.5px;color:var(--ink-dim)}
#srcBox{width:100%;height:210px;margin-top:10px;resize:vertical;padding:9px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.4;white-space:pre;overflow:auto}
.steps{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;align-items:start}
.steps li>div{min-width:0}
.steps li::before{counter-increment:s;content:counter(s);
  width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:600;
  font-family:"IBM Plex Mono",monospace}
.steps p{margin:0 0 4px}
.steps small{color:var(--ink-dim);font-size:11px;display:block}
.kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--panel-2);
  border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px}
.diagram{margin-top:8px;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;
  background:var(--panel-2)}
.diagram svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <div class="brand">Coin Case Rig<span id="tSub"></span></div>
    <div class="chips" id="chips"></div>
    <div class="right">
      <div class="palwrap"><div class="palette" id="palette"></div>
        <span class="palhint" id="palHint"></span></div>
      <select id="lang" class="langsel" aria-label="Language"></select>
      <button type="button" class="btn" id="helpBtn"></button>
      <button type="button" class="btn" id="stlBtn" hidden></button>
      <button type="button" class="btn p" id="filesBtn"></button>
    </div>
  </div>

  <div class="body">
    <div class="rail" id="railL"></div>

    <div class="stage">
      <div class="stagebar">
        <div class="seg" id="viewmode" style="flex:0 0 auto">
          <button type="button" data-vm="ortho" aria-pressed="true" title="Три ортогональных вида">
            <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true">
              <g class="a" fill="none" stroke="var(--ink-dim)" stroke-width="1.2">
                <rect x="1" y="1" width="11" height="5.5" rx="1"/>
                <rect x="1" y="8" width="11" height="5" rx="1"/>
                <rect x="14" y="1" width="7" height="12.5" rx="1"/>
              </g></svg><span id="tOrtho"></span></button>
          <button type="button" data-vm="iso" aria-pressed="false" title="Изометрия">
            <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true">
              <g class="a" fill="none" stroke="var(--ink-dim)" stroke-width="1.2"
                 stroke-linejoin="round">

<script>
"use strict";
const SCAD_RU = "// ===========================================================================\n// coin_case.scad — параметрический шарнирный кейс для монеты.\n//\n// ОДИН файл на обе половинки. Раньше part1 и part2 жили в отдельных файлах\n// с собственными копиями H/T и собственным (чуть разным!) радиусом кармана —\n// из-за этого половинки могли разъехаться. Теперь у них ОБЩИЙ блок\n// параметров: карман, габариты и толщина считаются один раз и используются\n// обеими деталями, так что рассинхрон физически невозможен.\n//\n// Вся геометрия — чистая CSG OpenSCAD (cube/cylinder/hull/rotate_extrude/\n// linear_extrude/difference). Никаких import() и никаких STL.\n//\n// Оси: X — длина, Y — толщина (лицевая сторона с карманом смотрит в +Y),\n// Z — высота.\n// ===========================================================================\n\n/* [Что рендерить] */\n// part1 — половинка со штифтом и гравировкой; part2 — ответная с глубоким\n// карманом; assembly — обе в сомкнутом виде; print — обе лежат на столе,\n// петля сцеплена (печать \"as assembled\", шарнир печатается сразу собранным).\nrender_part = \"print\"; // [part1, part2, assembly, print]\n\n/* [Монета] */\ncoin_d     = 45.2;  // диаметр монеты, мм // [5:0.1:150]\ncoin_t     = 3.0;   // толщина монеты, мм // [0.3:0.1:25]\ncoin_clear = 0.4;   // зазор вокруг монеты (на сторону), мм // [0:0.05:3]\n\n/* [Габариты кейса] */\n// Это ЖЕЛАЕМЫЕ габариты одной половинки. Если монета в них не влезает с\n// минимальной стенкой wall_min, размер автоматически увеличивается до\n// минимально допустимого — см. блок \"Расчёт\" ниже. То есть крутить диаметр\n// монеты можно свободно: корпус подстроится сам.\ncase_w = 70.0;  // ширина одной половинки (X), мм // [30:0.5:250]\ncase_h = 70.0;  // высота (Z), мм // [30:0.5:250]\ncase_t = 10.0;  // толщина одной половинки (Y), мм // [4:0.5:50]\n\nwall_min = 1.5; // минимальная толщина стенки вокруг полости, мм // [0.8:0.1:6]\n\n/* [Карманы под монету] */\n// Диаметр у обеих полостей ОДИН и тот же (считается из диаметра монеты).\n// Глубина теперь тоже идёт за монетой: суммарная полость = толщина монеты\n// плюс осевой зазор, а lid_share делит её между половинками. Раньше глубины\n// были независимыми числами, и при смене монеты их приходилось подбирать\n// руками. Ползунки ниже — ПОДСТРОЙКА поверх расчёта: 0 = как посчиталось,\n// плюс/минус — сделать эту сторону глубже или мельче.\ncoin_gap_axial = 0.4;   // свободный ход монеты по толщине, мм // [0:0.05:5]\nlid_share      = 0.32;  // какая доля полости приходится на крышку // [0.1:0.01:0.9]\nlid_extra      = 0;     // подстройка глубины крышки, мм // [-10:0.1:25]\nbase_extra     = 0;     // подстройка глубины основания, мм // [-10:0.1:25]\n\n/* [Вырезы под пальцы (part2)] */\n// Два круглых углубления на ободе большого кармана — чтобы поддеть монету.\n// Заданные здесь размеры НЕ ужимаются под корпус: наоборот, корпус\n// подрастает так, чтобы вырезы в него поместились (см. H_need в расчёте).\n// Центр выреза сидит РОВНО на ободе полости — так он и стоял в исходной\n// модели. Свободного сдвига здесь нет намеренно: отодвинутый от обода вырез\n// перестаёт цеплять монету (поддеть ею нечего), а корпус при этом разрастается\n// вслед за ним. Менять можно размер и форму, место — нет.\nfinger_notch_enable = true;\nfinger_notch_d      = 15.0; // размер выреза, мм // [4:0.5:50]\nfinger_notch_depth  = 6.5;  // глубина выреза, мм // [0.5:0.1:30]\nfinger_notch_fillet = 4.0;  // радиус скругления дна выреза, мм // [0:0.1:15]\nfinger_notch_shape  = 0;    // 0 = круглый, 1 = скруглённый квадрат // [0:1]\nfinger_notch_corner = 3.0;  // радиус углов у квадратного выреза, мм // [0.5:0.1:20]\n\n/* [Гравировка (задняя сторона part1)] */\ntext_enable = true;\ntext_line1 = \"HAPPY BIRTHDAY\";\ntext_line2 = \"TO NATHAN\";\ntext_line3 = \"FROM DAD\";\ntext_line4 = \"\";\ntext_line5 = \"\";\ntext_line6 = \"\";\ntext_line7 = \"\";\ntext_line8 = \"\";\ntext_size  = 6.0;   // высота символов, мм // [1:0.1:20]\ntext_line_pitch = 1.45; // межстрочный интервал, множитель text_size // [1:0.05:3]\ntext_depth = 0.6;   // глубина гравировки, мм // [0.1:0.05:3]\ntext_shift_h = 0;   // сдвиг текста вдоль строк (вправо+), мм // [-120:0.5:120]\ntext_shift_v = 0;   // сдвиг текста поперёк строк (вверх+), мм // [-120:0.5:120]\ntext_font = \"Liberation Sans:style=Bold\";\n// [Liberation Sans:style=Bold, Liberation Sans, Liberation Serif:style=Bold, Liberation Serif, Liberation Mono:style=Bold, Liberation Mono, DejaVu Sans:style=Bold, DejaVu Sans, DejaVu Serif:style=Bold, DejaVu Serif]\ntext_autofit = true;  // автоматически уменьшать кегль, если строка не влезает\n\n/* [Иконка (гравируется рядом с текстом)] */\nicon_type     = 0;   // 0=нет 1=сердце 2=звезда 3=колокольчик 4=смайлик 5=подарок 6=корона 7=клевер 8=снежинка 9=цветок 10=ёлка // [0:10]\nicon_size     = 12;  // размер иконки, мм // [3:0.5:60]\nicon_shift_h = 0;    // сдвиг иконки вдоль строк (вправо+), мм // [-120:0.5:120]\nicon_shift_v = 0;    // подстройка иконки поперёк, от её места над текстом, мм // [-120:0.5:120]\n\n/* [Hidden] */\n// Контур своей картинки, переведённый на странице в двухцветный силуэт.\n// Пустой список путей — своей иконки нет; icon_type = 99 выбирает именно её.\ncustom_icon_pts   = [[0,0]];\ncustom_icon_paths = [];\n\n/* [Показ] */\n// Монета рисуется модификатором % — она видна в предпросмотре, но НЕ входит\n// ни в рендер (F6), ни в экспорт STL. Нужна только чтобы глазами проверить,\n// как монета садится в полость и сколько над ней остаётся места.\nshow_coin = false;\n\n// Цвета половинок — ТОЛЬКО для предпросмотра. STL цвета не хранит: реальную\n// многоцветность назначают в слайсере. Пустая строка — без окраски.\nlid_color  = \"\";\nbase_color = \"\";\n\n/* [Hidden] */\n// --- сопрягаемая геометрия петли (снята с граней исходного STEP) ---------\nknuckle_x = 3.5;    // ось петли/штифта по X — ОБЩАЯ для обеих деталей\nknuckle_r = 3.5;    // радиус \"бочонков\" петли\ntab_len   = 8.45;   // внутренний край плиты part1 (со стороны петли)\nwall_x    = -1.45;  // внутренний край плиты part2 (зеркально)\npin_r     = 1.65;   // радиус штифта\npin_clear = 0.35;   // зазор отверстия под штифт в part2\npin_overhang_set = 1.5; // выступ штифта за торцы (в режиме print обнуляется)\nhinge_side_clear = 0.5; // зазор бочонка part2 в проёме part1 (на сторону)\n\nedge_chamfer   = 0.6; // мелкая фаска по периметру плиты\npocket_chamfer_set = 1.0; // фаска на входе карманов\nboss_y         = 6.8; // выступ прилива-защёлки над лицевой стороной part1\n\n$fn = 72;\n\n// ===========================================================================\n// РАСЧЁТ — здесь габариты связываются с полостью под монету.\n// Все переменные ниже вычисляемые (ссылаются на другие), поэтому в панели\n// Customizer они не показываются — это внутренняя кухня, а не ручки.\n// ===========================================================================\n\n// Полость под монету: диаметр монеты + зазор с каждой стороны. ОДИН на обе\n// половинки — вот та самая автосинхронизация карманов.\ncav_d = coin_d + 2 * coin_clear;\ncav_r = cav_d / 2;\n\n// Вырезы под пальцы — такой же ограничитель габарита, как и сама полость.\n// Раньше они, наоборот, прижимались внутрь при нехватке места и на большой\n// монете просто тонули в кармане. Теперь двигается корпус, а вырезы стоят\n// там, где их поставили.\nfn_r    = finger_notch_d / 2;\nfn_dist = cav_r;                         // центр выреза — на ободе полости\n\n// Габариты: не меньше, чем полость (или вырезы) + минимальная стенка.\n// Именно поэтому при увеличении монеты корпус растёт сам.\nW_need = max(cav_d, finger_notch_enable ? 2 * fn_r : 0) + 2 * wall_min;\nH_need = max(cav_d + 2 * wall_min,\n             finger_notch_enable ? 2 * (fn_dist + fn_r + wall_min) : 0);\nW = max(case_w, W_need);\nH = max(case_h, H_need);\n\n// Глубина полости идёт за толщиной монеты: обе половинки пересчитываются\n// вместе с ней и сохраняют заданную пропорцию lid_share. Подстройки\n// lid_extra/base_extra прибавляются сверху, но опуститься ниже 0.4 мм\n// карману не дадут — иначе он выродился бы в плёнку.\ncav_need   = coin_t + coin_gap_axial;\nlid_depth  = max(0.4, cav_need * lid_share       + lid_extra);\nbase_depth = max(0.4, cav_need * (1 - lid_share) + base_extra);\n\n// Толщина одной половинки: не меньше самого глубокого кармана + стенка.\n// Считается ОДИНАКОВО для обеих деталей (учитываются оба кармана и вырез\n// под пальцы), иначе половинки получились бы разной толщины.\nnotch_d_eff = finger_notch_enable ? finger_notch_depth : 0;\nT = max(case_t,\n        lid_depth + wall_min,\n        base_depth + wall_min,\n        notch_d_eff + wall_min);\n\n// Суммарная глубина полости и фактический зазор под монету по толщине.\ncav_depth_total = lid_depth + base_depth;\ncoin_gap        = cav_depth_total - coin_t;\n\n// Скругление торца — не больше половины габарита, иначе контур вырождается.\ncorner_r      = min(7.0, H / 2 - 0.5, W / 2 - 0.5);\ncorner_cz_bot = corner_r;\ncorner_cz_top = H - corner_r;\n\n// Проём петли part1 / бочонок part2 — центрируются по H/2 и ужимаются на\n// малых H, чтобы у торцов всегда оставался материал.\ngap_half    = min(17.75, H / 2 - 6);\ngap_z_lo    = H / 2 - gap_half;\ngap_z_hi    = H / 2 + gap_half;\nbarrel_half = gap_half - hinge_side_clear;\nbarrel_z_lo = H / 2 - barrel_half;\nbarrel_z_hi = H / 2 + barrel_half;\n\nknuckle_y   = T;            // ось петли лежит на лицевой плоскости\npin_clear_r = pin_r + pin_clear;\npin_overhang = (render_part == \"print\") ? 0 : pin_overhang_set;\n\n// Границы плит по X.\np1_x0 = tab_len;          // внутренний край part1\np1_x1 = tab_len + W;      // наружный край part1\np2_x0 = wall_x;           // внутренний край part2\np2_x1 = wall_x - W;       // наружный край part2\n\np1_cx = tab_len + W / 2;  // центр плиты part1 по X\np2_cx = wall_x  - W / 2;  // центр плиты part2 по X\nface_cz = H / 2;          // центр по Z (общий)\n\n// Фаски карманов — не глубже самого кармана.\npocket_chamfer     = min(pocket_chamfer_set, lid_depth * 0.5, cav_r * 0.5);\nbig_pocket_chamfer = min(pocket_chamfer_set, base_depth * 0.5, cav_r * 0.5);\n\n// Вырез под палец: скругление дна не больше собственного радиуса и глубины.\nfn_fillet = min(finger_notch_fillet, fn_r * 0.95, finger_notch_depth * 0.95);\nfn_wall_d = finger_notch_depth - fn_fillet;   // прямая стенка до скругления\n// Позиция берётся как есть — под неё уже подобрана высота H (см. H_need).\nfn_z_lo   = H / 2 - fn_dist;\nfn_z_hi   = H / 2 + fn_dist;\n\n// ===========================================================================\n// Общие вспомогательные модули\n// ===========================================================================\n\n// Контур плиты в плоскости X,Z: прямой внутренний край (со стороны петли) и\n// скруглённый наружный торец. dir = +1 для part1 (растёт вправо), -1 для\n// part2 (растёт влево) — обе плиты зеркальны относительно оси петли.\nmodule outline2d(x_inner, dir) {\n    x_corner = x_inner + dir * (W - corner_r);\n    hull() {\n        translate([x_corner, corner_cz_bot]) circle(r = corner_r, $fn = 64);\n        translate([x_corner, corner_cz_top]) circle(r = corner_r, $fn = 64);\n        translate([x_inner, 0]) circle(r = 0.01, $fn = 12);\n        translate([x_inner, H]) circle(r = 0.01, $fn = 12);\n    }\n}\n\nmodule p1_outline() { outline2d(p1_x0, +1); }\nmodule p2_outline() { outline2d(p2_x0, -1); }\n\n// Выдавливает 2D-фигуру (заданную в плоскости X,Z) вдоль оси Y на толщину\n// thick, начиная с y = yoff. Инкапсулирует поворот осей в одном месте.\nmodule xz_extrude(yoff, thick) {\n    translate([0, yoff, H])\n        rotate([-90, 0, 0])\n            linear_extrude(thick)\n                children();\n}\n\n// Плита с мелкой фаской по всему периметру спереди и сзади — единым телом.\nmodule chamfered_plate(chamfer) {\n    union() {\n        xz_extrude(chamfer, T - 2 * chamfer) children();\n        hull() {\n            xz_extrude(0, 0.01)       offset(-chamfer) children();\n            xz_extrude(chamfer, 0.01) children();\n        }\n        hull() {\n            xz_extrude(T - chamfer, 0.01) children();\n            xz_extrude(T, 0.01)           offset(-chamfer) children();\n        }\n    }\n}\n\n// Профиль \"бочонка\" петли: круг петли, стянутый касательными к прямому краю\n// плиты. Две дополнительные точки на каждом торце повторяют фаску плиты —\n// без них на стыке торчали тонкие \"усики\" (реальный дефект геометрии, а не\n// артефакт preview).\nmodule knuckle_barrel_profile(x_wall, dir) {\n    hull() {\n        translate([knuckle_x, knuckle_y]) circle(r = knuckle_r, $fn = 48);\n        translate([x_wall + dir * edge_chamfer, 0]) circle(r = 0.01, $fn = 8);\n        translate([x_wall, edge_chamfer])           circle(r = 0.01, $fn = 8);\n        translate([x_wall, T - edge_chamfer])       circle(r = 0.01, $fn = 8);\n        translate([x_wall + dir * edge_chamfer, T]) circle(r = 0.01, $fn = 8);\n    }\n}\n\n// Карман под монету — одно тело вращения: плоское дно, прямая стенка, фаска\n// на входе и технологический напуск сквозь лицевую грань.\nmodule coin_pocket(cx, depth, chamfer) {\n    ov = 2;\n    profile = [\n        [0, 0],\n        [cav_r, 0],\n        [cav_r, depth - chamfer],\n        [cav_r + chamfer, depth],\n        [cav_r + chamfer, depth + ov],\n        [0, depth + ov]\n    ];\n    translate([cx, T - depth, face_cz])\n        rotate([-90, 0, 0])\n            rotate_extrude($fn = 160) polygon(profile);\n}\n\n// ===========================================================================\n// PART 1 — половинка со штифтом, мелким карманом и гравировкой\n// ===========================================================================\n\nmodule p1_knuckle_barrels() {\n    linear_extrude(gap_z_lo) knuckle_barrel_profile(p1_x0, +1);\n    translate([0, 0, gap_z_hi])\n        linear_extrude(H - gap_z_hi) knuckle_barrel_profile(p1_x0, +1);\n}\n\nmodule hinge_pin() {\n    translate([knuckle_x, knuckle_y, -pin_overhang])\n оверено контрольным рендером: в этом виде петля уходит\n// влево, т.е. экранное \"вправо\" = +X = +u, а экранное \"вверх\" = +Z = -v)\n// обычный текст читался бы слева направо правильно, но был бы перевёрнут по\n// вертикали. Компенсирует это ровно один переворот по v — mirror([0,1,0]).\n// Поворот на 180° здесь НЕ подходит: он даёт зеркальные буквы справа налево\n// (проверено рендером, было именно так).\n//\n// Автоподгон кегля: OpenSCAD не умеет измерять реальную ширину строки, так\n// что она оценивается посимвольно — у заглавных, цифр и узких букв ширина\n// заметно разная, и грубая оценка \"0.6 кегля на символ\" врала настолько, что\n// строка вроде \"HAPPY BIRTHDAY\" вылезала за плиту и срезалась обрезкой.\n// Таблица ниже (доли от кегля) даёт куда более честную длину. Веб-конфигуратор\n// поверх этого измеряет текст по-настоящему и подставляет уже готовый кегль —\n// эта оценка нужна тем, кто открывает .scad напрямую или крутит его на\n// MakerWorld.\n// Доли ОТ ЗНАЧЕНИЯ size, а не от em: в OpenSCAD size — это примерно высота\n// заглавной буквы, а em заметно больше (замерено рендером: \"HAPPY BIRTHDAY\"\n// шрифтом Liberation Sans Bold при size=6 занимает 70.9 мм, т.е. 11.8·size).\n// Первая версия таблицы считала в долях em и занижала ширину почти на четверть,\n// из-за чего автоподгон не срабатывал и длинная строка срезалась обрезкой.\nfunction _cw(c) =\n    (c == \" \" || c == \".\" || c == \",\" || c == \":\" || c == \";\" || c == \"'\"\n     || c == \"!\" || c == \"|\" || c == \"i\" || c == \"j\" || c == \"l\") ? 0.39 :\n    (c == \"I\" || c == \"t\" || c == \"f\" || c == \"r\" || c == \"(\" || c == \")\") ? 0.46 :\n    (c == \"m\" || c == \"M\" || c == \"W\" || c == \"w\" || c == \"@\") ? 1.20 :\n    (c >= \"A\" && c <= \"Z\") ? 0.97 :\n    (c >= \"0\" && c <= \"9\") ? 0.77 :\n    0.78;\nfunction _strw(s, i = 0) = i >= len(s) ? 0 : _cw(s[i]) + _strw(s, i + 1);\n\n// 8 слотов, а не 5: в веб-конфигураторе поля — это АБЗАЦЫ, длинный абзац\n// переносится на следующую строку, так что итоговых строк может быть больше,\n// чем введённых полей. Пустые слоты просто игнорируются.\nfunction _used_lines() = [for (s = [text_line1, text_line2, text_line3,\n                                    text_line4, text_line5, text_line6,\n                                    text_line7, text_line8]) if (len(s) > 0) s];\n\nmodule text_engrave() {\n    lines = _used_lines();\n    n = len(lines);\n    // ПЛОСКОСТЬ РАЗВЁРНУТА НА 90°. Деталь держат петлёй ВНИЗ, скруглениями\n    // вверх — в этом положении строки читаются нормально, слева направо.\n    // Значит строка идёт вдоль оси Z детали (её длину ограничивает H), а\n    // строки набираются стопкой вдоль оси X (её ограничивает W). Раньше было\n    // наоборот: текст развернули, а плиту под ним — нет, и они разъезжались.\n    avail_line  = H - 2 * (wall_min + 1.5);   // длина строки\n    avail_stack = W - 2 * (wall_min + 1.5);   // высота блока строк\n    wmax = n > 0 ? max([for (s = lines) _strw(s)]) : 1;\n    icon_res  = icon_type > 0 ? icon_size * 1.25 : 0;\n    avail_st2 = avail_stack - icon_res;\n    fit_w = wmax > 0 ? avail_line / wmax : text_size;\n    fit_h = n > 0 ? avail_st2 / (n * text_line_pitch) : text_size;\n    fit   = text_autofit ? min(text_size, fit_w, fit_h) : text_size;\n    pitch = fit * text_line_pitch;\n    // Экранное \"вправо\" смотрит по -Z, экранное \"вверх\" — по +X.\n    //\n    // ГРАНИЦЫ. Раньше смещения были зажаты только числовым диапазоном\n    // ±120 мм, а не краями крышки: текст спокойно уезжал за плиту, и его\n    // спасала лишь аварийная обрезка по контуру — то есть буквы просто\n    // срезало. Теперь блок упирается в безопасную зону всеми четырьмя\n    // сторонами: дотянул до края — дальше не идёт.\n    marg = wall_min + 1.5;\n    half_line  = wmax * fit / 2;           // половина длины самой длинной строки\n    half_stack = n * pitch / 2;            // половина высоты блока строк\n    lz_lo = marg + half_line;\n    lz_hi = H - marg - half_line;\n    sx_lo = p1_x0 + marg + half_stack;\n    sx_hi = p1_x1 - marg - half_stack;\n    line_z  = min(max(face_cz - text_shift_h, lz_lo), max(lz_lo, lz_hi));\n    stack_x = min(max(p1_cx + text_shift_v - icon_res / 2, sx_lo), max(sx_lo, sx_hi));\n    ov = 0.3;\n\n    intersection() {\n        xz_extrude(-ov, text_depth + ov)\n        // Гравировка развёрнута на 180° относительно плиты: деталь держат\n        // петлёй ВВЕРХ, скруглениями вниз — так надпись читается правильно.\n        // Поворот делается целиком вокруг центра плиты, поэтому все сдвиги\n        // и позиция иконки продолжают работать как раньше.\n        translate([p1_cx, H / 2]) rotate(180) translate([-p1_cx, -H / 2]) {\n            union() {\n                // mirror([0,1,0]) компенсирует перевёрнутую ось 2D-системы\n                // (v = H - z) и взгляд с задней грани; rotate(-90) доворачивает\n                // строку в новую ориентацию. Порядок проверен рендером.\n                if (n > 0)\n                    for (i = [0:n - 1])\n                        translate([stack_x + ((n - 1) / 2 - i) * pitch, H - line_z])\n                            mirror([0, 1, 0])\n                                rotate(-90)\n                                    text(lines[i], size = fit, font = text_font,\n                                         halign = \"center\", valign = \"center\");\n                // Иконка — над блоком строк, дальше по +X. Прижимается к той же\n                // безопасной зоне, причём по ОБЕИМ осям: раньше держалась только\n                // поперечная, и вбок иконка уходила за край.\n                // Знак icon_shift_h такой же, как у текста: экранное \"вправо\"\n                // идёт по -Z, поэтому положительный сдвиг уменьшает z.\n                if (icon_type > 0)\n                    let(ihalf  = icon_size / 2,\n                        ix_lo  = p1_x0 + marg + ihalf,\n                        ix_hi  = p1_x1 - marg - ihalf,\n                        iz_lo  = marg + ihalf,\n                        iz_hi  = H - marg - ihalf,\n                        ix = min(max(stack_x + half_stack + icon_size * 0.6 + icon_shift_v,\n                                     ix_lo), max(ix_lo, ix_hi)),\n                        iz = min(max(line_z - icon_shift_h, iz_lo), max(iz_lo, iz_hi)))\n                    translate([ix, H - iz])\n                        mirror([0, 1, 0])\n                            rotate(-90)\n                                icon_shape(icon_type, icon_size);\n            }\n        }\n        // страховочная обрезка по контуру детали с отступом в стенку\n        xz_extrude(-ov, T + 2 * ov) offset(-wall_min) p1_outline();\n    }\n}\n\nmodule part1() {\n    union() {\n        difference() {\n            union() {\n                chamfered_plate(edge_chamfer) p1_outline();\n                boss();\n                p1_knuckle_barrels();\n            }\n            coin_pocket(p1_cx, lid_depth, pocket_chamfer);\n            if (text_enable) text_engrave();\n        }\n        hinge_pin();\n    }\n}\n\n// ===========================================================================\n// PART 2 — ответная половинка: один бочонок, глубокий карман, вырезы\n// ===========================================================================\n\nmodule p2_knuckle_barrel() {\n    translate([0, 0, barrel_z_lo])\n        linear_extrude(barrel_z_hi - barrel_z_lo)\n            knuckle_barrel_profile(p2_x0, -1);\n}\n\nmodule pin_clearance_hole() {\n    translate([knuckle_x, knuckle_y, barrel_z_lo - 1])\n        cylinder(r = pin_clear_r, h = (barrel_z_hi - barrel_z_lo) + 2, $fn = 32);\n}\n\n// Плоское сечение выреза, ужатое внутрь на d. Через offset() обе формы\n// живут в одном коде: круг остаётся кругом, квадрат — скруглённым квадратом,\n// и обеим одинаково достаётся скругление дна.\nmodule fn_section(d) {\n    if (finger_notch_shape == 0) {\n        circle(r = max(fn_r + d, 0.01), $fn = 72);\n    } else {\n        c = min(finger_notch_corner, fn_r * 0.95);\n        side = max(2 * (fn_r - c), 0.02);\n        offset(r = max(c + d, 0.01), $fn = 40) square([side, side], center = true);\n    }\n}\n\n// Вырез под палец: плоское дно, скруглённый переход к стенке, прямая стенка\n// до лицевой грани и напуск сквозь неё. Раньше это было тело вращения, и\n// форма могла быть только круглой; теперь дно набирается тонкими слоями по\n// той же дуге, а сечение берётся из fn_section — поэтому скругление\n// одинаково ложится и на круг, и на квадрат.\nmodule finger_notch(z) {\n    ov = 2;\n    total_d = fn_wall_d + fn_fillet;\n    steps = 9;\n    translate([p2_cx, T - total_d, z]) rotate([-90, 0, 0]) {\n        if (fn_fillet > 0.01) {\n            for (i = [0 : steps - 1]) {\n                a0 = 90 - i * 90 / steps;\n                a1 = 90 - (i + 1) * 90 / steps;\n                hull() {\n                    translate([0, 0, fn_fillet * (1 - sin(a0))])\n                        linear_extrude(0.01) fn_section(-fn_fillet * (1 - cos(a0)));\n                    translate([0, 0, fn_fillet * (1 - sin(a1))])\n                        linear_extrude(0.01) fn_section(-fn_fillet * (1 - cos(a1)));\n                }\n            }\n        }\n        translate([0, 0, fn_fillet])\n            linear_extrude(total_d - fn_fillet + ov) fn_section(0);\n    }\n}\n\n// Монета для наглядности: лежит на дне глубокого кармана. Вызывается только\n// с модификатором % — видна в предпросмотре, не попадает ни в рендер, ни в STL.\nmodule coin_dummy() {\n    translate([p2_cx, T - base_depth, face_cz])\n        rotate([-90, 0, 0])\n            cylinder(r = coin_d / 2, h = coin_t, $fn = 96);\n}\n\nmodule part2() {\n    difference() {\n        union() {\n            chamfered_plate(edge_chamfer) p2_outline();\n            p2_knuckle_barrel();\n        }\n        pin_clearance_hole();\n        coin_pocket(p2_cx, base_depth, big_pocket_chamfer);\n        if (finger_notch_enable) {\n            finger_notch(fn_z_lo);\n            finger_notch(fn_z_hi);\n        }\n    }\n}\n\n// ===========================================================================\n// Вывод\n// ===========================================================================\n\n// В режиме \"print\" обе детали кладутся плашмя на стол (поворот на 90° вокруг\n// X переводит толщину Y в высоту над столом) и центрируются по началу\n// координат. Петля при этом остаётся сцепленной — шарнир печатается сразу\n// собранным. Гравированная сторона part1 при такой раскладке лежит на столе:\n// так карманы смотрят вверх и не нуждаются в поддержках, а гравировка\n// нормально пропечатывается первым слоем.\nmodule lay_flat() {\n    translate([-knuckle_x, H / 2, 0.02])\n        rotate([90, 0, 0])\n            children();\n}\n\n// tint() красит только если цвет задан: color(\"\") в OpenSCAD — ошибка.\nmodule tint(c) { if (c == \"\") children(); else color(c) children(); }\n\nif (render_part == \"part1\") {\n    tint(lid_color) part1();\n} else if (render_part == \"part2\") {\n    tint(base_color) part2();\n    if (show_coin) %coin_dummy();\n} else if (render_part == \"assembly\") {\n    tint(lid_color) part1();\n    tint(base_color) part2();\n    if (show_coin) %coin_dummy();\n} else {\n    lay_flat() {\n        tint(lid_color) part1();\n        tint(base_color) part2();\n        if (show_coin) %coin_dummy();\n    }\n}\n";
const SCAD_EN = "// ===========================================================================\n// Customisable coin case — a hinged, print-in-place box for a single coin.\n//\n// One file builds both halves. They share one parameter block, so the pocket\n// diameter, the outside dimensions and the wall thickness are worked out once\n// and used by both halves — the two sides can never drift apart.\n//\n// Set the coin diameter and thickness and everything else follows: the cavity\n// is sized from the coin, and the body grows automatically whenever the coin\n// would leave less than `min_wall` of material around it. Up to 8 lines of\n// text and an icon are engraved on the outside of the lid. Hold the case with\n// the hinge at the bottom and the rounded corners up — that is the way the\n// engraving reads.\n//\n// Pure OpenSCAD CSG geometry (cube / cylinder / hull / rotate_extrude /\n// linear_extrude / difference) — no imported meshes.\n//\n// Printing: pick render_part = \"print\". Both halves lie flat with the hinge\n// already engaged, so the case comes off the plate assembled. Pockets face\n// up and need no supports; the engraved face sits on the build plate.\n//\n// Axes: X — length, Y — thickness (the pocket faces +Y), Z — height.\n// ===========================================================================\n\n\n/* [Output] */\nrender_part = \"print\";  // what to build // [part1, part2, assembly, print]\n\n/* [Coin] */\ncoin_diameter     = 45.2;  // coin diameter, mm // [5:0.1:150]\ncoin_thickness     = 3.0;  // coin thickness, mm // [0.3:0.1:25]\ncoin_clearance = 0.4;  // clearance around the coin, per side, mm // [0:0.05:3]\n\n/* [Overall size] */\ncase_width = 70.0;  // width of one half, mm // [30:0.5:250]\ncase_height = 70.0;  // height of one half, mm // [30:0.5:250]\ncase_thickness = 10.0;  // thickness of one half, mm // [4:0.5:50]\n\nmin_wall = 1.5;  // minimum wall around the cavity, mm // [0.8:0.1:6]\n\n/* [Coin pockets] */\ncoin_gap_axial = 0.4;  // free play for the coin through the thickness, mm // [0:0.05:5]\nlid_share_of_cavity      = 0.32;  // share of the cavity that goes into the lid // [0.1:0.01:0.9]\nlid_pocket_trim      = 0;  // trim the lid pocket deeper or shallower, mm // [-10:0.1:25]\nbase_pocket_trim     = 0;  // trim the base pocket deeper or shallower, mm // [-10:0.1:25]\n\n/* [Finger notches] */\nfinger_notch_enable = true;  // add the finger notches\nfinger_notch_d      = 15.0;  // notch size, mm // [4:0.5:50]\nfinger_notch_depth  = 6.5;  // notch depth, mm // [0.5:0.1:30]\nfinger_notch_fillet = 4.0;  // notch bottom fillet, mm // [0:0.1:15]\nfinger_notch_shape  = 0;  // 0 = round, 1 = rounded square // [0:1]\nfinger_notch_corner = 3.0;  // corner radius of a square notch, mm // [0.5:0.1:20]\n\n/* [Engraving] */\ntext_enable = true;  // engrave the text\ntext_line1 = \"HAPPY BIRTHDAY\";  // line 1\ntext_line2 = \"TO NATHAN\";  // line 2\ntext_line3 = \"FROM DAD\";  // line 3\ntext_line4 = \"\";  // line 4\ntext_line5 = \"\";  // line 5\ntext_line6 = \"\";  // line 6\ntext_line7 = \"\";  // line 7\ntext_line8 = \"\";  // line 8\ntext_size  = 6.0;  // cap height, mm // [1:0.1:20]\ntext_line_pitch = 1.45;  // line spacing, multiple of cap height // [1:0.05:3]\ntext_depth = 0.6;  // engraving depth, mm // [0.1:0.05:3]\ntext_shift_h = 0;  // shift the text along the lines, right +, mm // [-120:0.5:120]\ntext_shift_v = 0;  // shift the text across the lines, up +, mm // [-120:0.5:120]\ntext_font = \"Liberation Sans:style=Bold\";  // font\n// [Liberation Sans:style=Bold, Liberation Sans, Liberation Serif:style=Bold, Liberation Serif, Liberation Mono:style=Bold, Liberation Mono, DejaVu Sans:style=Bold, DejaVu Sans, DejaVu Serif:style=Bold, DejaVu Serif]\ntext_autofit = true;  // shrink the text automatically so it fits the lid\n\n/* [Icon] */\nicon_type     = 0;  // 0=none 1=heart 2=star 3=bell 4=smiley 5=gift 6=crown 7=clover 8=snowflake 9=flower 10=tree, 99=your own picture // [0:10]\nicon_size     = 12;  // icon size, mm // [3:0.5:60]\nicon_shift_h = 0;  // shift the icon along the lines, right +, mm // [-120:0.5:120]\nicon_shift_v = 0;  // nudge the icon across, from its place above the text, mm // [-120:0.5:120]\n\n/* [Hidden] */\ncustom_icon_pts   = [[0,0]];  // outline of your own picture, traced on the page\ncustom_icon_paths = [];  // contours of that outline\n\n/* [Preview] */\nshow_coin = false;  // draw the coin in preview only, never exported\n\nlid_color  = \"\";  // lid colour, preview only (STL has no colour)\nbase_color = \"\";  // base colour, preview only (STL has no colour)\n\n/* [Hidden] */\nknuckle_x = 3.5;\nknuckle_r = 3.5;\ntab_len   = 8.45;\nwall_x    = -1.45;\npin_r     = 1.65;\npin_clear = 0.35;\npin_overhang_set = 1.5;\nhinge_side_clear = 0.5;\n\nedge_chamfer   = 0.6;\npocket_chamfer_set = 1.0;\nboss_y         = 6.8;\n\n$fn = 72;\n\ncav_d = coin_diameter + 2 * coin_clearance;\ncav_r = cav_d / 2;\n\nfn_r    = finger_notch_d / 2;\nfn_dist = cav_r;\n\nW_need = max(cav_d, finger_notch_enable ? 2 * fn_r : 0) + 2 * min_wall;\nH_need = max(cav_d + 2 * min_wall,\n             finger_notch_enable ? 2 * (fn_dist + fn_r + min_wall) : 0);\nW = max(case_width, W_need);\nH = max(case_height, H_need);\n\ncav_need   = coin_thickness + coin_gap_axial;\nlid_depth  = max(0.4, cav_need * lid_share_of_cavity       + lid_pocket_trim);\nbase_depth = max(0.4, cav_need * (1 - lid_share_of_cavity) + base_pocket_trim);\n\nnotch_d_eff = finger_notch_enable ? finger_notch_depth : 0;\nT = max(case_thickness,\n        lid_depth + min_wall,\n        base_depth + min_wall,\n        notch_d_eff + min_wall);\n\ncav_depth_total = lid_depth + base_depth;\ncoin_gap        = cav_depth_total - coin_thickness;\n\ncorner_r      = min(7.0, H / 2 - 0.5, W / 2 - 0.5);\ncorner_cz_bot = corner_r;\ncorner_cz_top = H - corner_r;\n\ngap_half    = min(17.75, H / 2 - 6);\ngap_z_lo    = H / 2 - gap_half;\ngap_z_hi    = H / 2 + gap_half;\nbarrel_half = gap_half - hinge_side_cl let _cv = null;
function measure(str, css, w, px){
  if(!_cv) _cv = document.createElement("canvas").getContext("2d");
  _cv.font = w + " " + px + "px " + css;
  return _cv.measureText(str).width;
}
/* Строка идёт вдоль оси Z детали (её ограничивает H), строки набираются
   стопкой вдоль X (ограничивает W) — плоскость развёрнута на 90°. */
function layoutText(m){
  const s = state, f = fontDef(s.text_font);
  const paras = [s.p1,s.p2,s.p3,s.p4,s.p5].map(x => (x||"").trim()).filter(x => x.length);
  const availLine = m.H - 2*m.margin, availStack = m.W - 2*m.margin;
  const iconRes = s.icon_type > 0 ? s.icon_size*1.25 : 0;
  if(!paras.length || !s.text_enable)
    return {lines:[], size:s.text_size, pitch:0, shrunk:false, iconRes, widest:0};
  const availSt = availStack - iconRes;
  const REF = 100, wOf = str => measure(str, f.css, f.w, REF)/REF;
  let size = s.text_size, lines = [], guard = 0, shrunk = false, widest = 0;
  while(guard++ < 80){
    const em = size*EM_PER_SIZE;
    lines = [];
    for(const p of paras){
      let cur = "";
      for(const w of p.split(/\s+/)){
        const t = cur ? cur + " " + w : w;
        if(wOf(t)*em <= availLine || !cur) cur = t;
        else { lines.push(cur); cur = w; }
      }
      if(cur) lines.push(cur);
    }
    widest = Math.max(...lines.map(wOf))*em;
    const block = lines.length*size*s.text_line_pitch;
    if(widest <= availLine + 1e-6 && block <= availSt && lines.length <= 8) break;
    size *= 0.96; shrunk = true;
    if(size < 0.8) break;
  }
  // widest нужна не только для подгонки: по ней рамка перетаскивания
  // обтягивает сам текст, а не всю безопасную зону — иначе ручка размера
  // вылезала за пунктир и выглядела оторванной от блока
  return {lines, size, pitch:size*s.text_line_pitch, shrunk, iconRes, widest};
}

/* ===================== контуры фигур =====================
   Полость с вырезами — это объединение нескольких фигур, и раньше я считал
   его «лучами из центра»: для каждого угла брал самую дальнюю точку
   пересечения луча с любой из фигур. Пока вырезы лежат на ободе, это совпадает
   с правдой, но стоит фигуре отойти или стать некруглой — контур рвётся и
   вырождается в длинную спицу.

   Теперь считается настоящее объединение: строится поле расстояний (внутри
   отрицательное), по нему трассируется нулевая изолиния. Это корректно для
   любых форм, для пересекающихся и для раздельных фигур — в последнем случае
   просто получается несколько отдельных контуров.
   ===================================================================== */
function sdCircle(c){ return (x,y) => Math.hypot(x-c.x, y-c.y) - c.r; }
function sdRRect(c){
  const hx = Math.max(c.w/2 - c.r, 0), hy = Math.max(c.h/2 - c.r, 0);
  return (x,y) => {
    const qx = Math.abs(x-c.x) - hx, qy = Math.abs(y-c.y) - hy;
    return Math.min(Math.max(qx,qy), 0) + Math.hypot(Math.max(qx,0), Math.max(qy,0)) - c.r;
  };
}

  const fs = shapes.map(c => c.kind === "rrect" ? sdRRect(c) : sdCircle(c));
  return (x,y) => { let v = 1e9; for(const f of fs){ const t = f(x,y); if(t < v) v = t; } return v; };
}
function shapeBBox(shapes){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const c of shapes){
    const hx = c.kind === "rrect" ? c.w/2 : c.r, hy = c.kind === "rrect" ? c.h/2 : c.r;
    x0 = Math.min(x0, c.x-hx); x1 = Math.max(x1, c.x+hx);
    y0 = Math.min(y0, c.y-hy); y1 = Math.max(y1, c.y+hy);

}
/* Отрезки нулевой изолинии по клетке. Индекс — какие углы внутри; сёдла
   (5 и 10) разводятся по знаку в центре клетки, иначе на перешейках контур
   соединяется крест-накрест. */
const MS_TABLE = [[], [[3,0]], [[0,1]], [[3,1]], [[1,2]], null, [[0,2]], [[3,2]],
                  [[2,3]], [[2,0]], null, [[2,1]], [[1,3]], [[1,0]], [[0,3]], []];
function marchingSquares(field, bb, res, level){
  const LV = level || 0;
  const w = bb.x1-bb.x0, h = bb.y1-bb.y0;
  const nx = Math.max(8, Math.round(res * w / Math.max(w,h)));
  const ny = Math.max(8, Math.round(res * h / Math.max(w,h)));
  const dx = w/nx, dy = h/ny;
  const V = new Float64Array((nx+1)*(ny+1));
  const at = (i,j) => V[j*(nx+1)+i];
  for(let j=0;j<=ny;j++) for(let i=0;i<=nx;i++)
    V[j*(nx+1)+i] = field(bb.x0 + i*dx, bb.y0 + j*dy) - LV;
  const segs = [];
  const lerp = (pa, pb, va, vb) => {
    const t = Math.abs(vb-va) < 1e-12 ? 0.5 : va/(va-vb);
    return [pa[0] + t*(pb[0]-pa[0]), pa[1] + t*(pb[1]-pa[1])];
  };
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const v = [at(i,j), at(i+1,j), at(i+1,j+1), at(i,j+1)];
    let idx = 0; for(let k=0;k<4;k++) if(v[k] < 0) idx |= 1<<k;
    if(idx === 0 || idx === 15) continue;
    const P = [[bb.x0+i*dx, bb.y0+j*dy], [bb.x0+(i+1)*dx, bb.y0+j*dy],
               [bb.x0+(i+1)*dx, bb.y0+(j+1)*dy], [bb.x0+i*dx, bb.y0+(j+1)*dy]];
    const E = [lerp(P[0],P[1],v[0],v[1]), lerp(P[1],P[2],v[1],v[2]),
               lerp(P[2],P[3],v[2],v[3]), lerp(P[3],P[0],v[3],v[0])];
    let pairs = MS_TABLE[idx];
    if(pairs === null){
      const cIn = field(bb.x0+(i+0.5)*dx, bb.y0+(j+0.5)*dy) - LV < 0;
      pairs = idx === 5 ? (cIn ? [[3,2],[1,0]] : [[3,0],[1,2]])
                        : (cIn ? [[0,1],[2,3]] : [[0,3],[2,1]]);
    }
    for(const [a,b] of pairs) segs.push([E[a], E[b]]);
  }
  // сшиваем отрезки в замкнутые кольца по совпадению концов
  const key = p => Math.round(p[0]*1e4) + "," + Math.round(p[1]*1e4);
  const from = new Map();
  for(const sg of segs){
    const k = key(sg[0]);
    if(!from.has(k)) from.set(k, []);
    from.get(k).push(sg);
  }
  const used = new Set(), rings = [];
  for(const sg of segs){
    if(used.has(sg)) continue;
    const ring = [sg[0]]; let cur = sg;
    for(let guard=0; guard<segs.length+5; guard++){
      used.add(cur); ring.push(cur[1]);
      const nxt = (from.get(key(cur[1])) || []).find(x => !used.has(x));
      if(!nxt) break;
      cur = nxt;
    }
    if(ring.length > 3) rings.push(ring);
  }
  return rings;
}

/* ===================== проекция =====================
   Раньше каждый вид считал свою геометрию сам, а изометрия — ещё и матрицей,
   подобранной на глаз. Отсюда шли и полосатые торцы, и надпись мимо коробки.
   Теперь проекция одна на всех: axo() задаётся образами трёх единичных осей,
   и через неё считаются и грани, и надпись на грани, и точки манипуляторов.

   Оси: u — вдоль вида вправо, v — вдоль вида вниз, w — из плоскости вверх
   (толщина). Плоский вид — это тот же axo с нулевым w.
   ===================================================================== */
function axo(tilt, yaw){
  const t = tilt*Math.PI/180, y = yaw*Math.PI/180;
  return {ex:[Math.cos(y), Math.sin(y)*Math.sin(t)],

const PROJ = {

  // у сечения ось толщины как раз рабочая, просто вид всё равно плоский.
  flat: {ex:[1,0], ey:[0,1], ez:[0,0], flat:true},     // план: u вправо, v вниз
  sect: {ex:[1,0], ey:[0,0], ez:[0,1], flat:true},     // сечение: u вправо, w вниз
  lift: axo(23, 15),                                   // лёгкий подъём: виден торец
  iso:  {ex:[Math.cos(Math.PI/6), 0.5],

     Через lift его рисовать нельзя: там w — «толщина плиты» с очень мелкой

const pj = (X,u,v,w) => { const P = X.proj || X;
  return [u*P.ex[0] + v*P.ey[0] + (w||0)*P.ez[0],

   оси, вдоль которой рукоятке разрешено двигаться. Две координаты на одну
   неизвестную — задача переопределена, берём проекцию; для плоского движения
   в плоскости вида решается система 2x2. */

  const d2 = a => a[0]*a[0] + a[1]*a[1];
  if(axis === "u") return (dx*P.ex[0] + dy*P.ex[1]) / d2(P.ex);
  if(axis === "v") return (dx*P.ey[0] + dy*P.ey[1]) / d2(P.ey);
  if(axis === "w") return (dx*P.ez[0] + dy*P.ez[1]) / d2(P.ez);
  const det = P.ex[0]*P.ey[1] - P.ex[1]*P.ey[0];
  if(Math.abs(det) < 1e-9) return {u:0, v:0};
  return {u:( dx*P.ey[1] - dy*P.ey[0]) / det,
          v:(-dx*P.ex[1] + dy*P.ex[0]) / det};

/* ===================== своя картинка в иконку =====================

   упрощается и ограничивается по числу точек: он уходит в .scad списком

function picSampler(img, N){

  const h = ar >= 1 ? Math.max(8, Math.round(N/ar)) : N;

  cx.fillStyle = "#fff"; cx.fillRect(0,0,w,h);
  cx.drawImage(img, 0, 0, w, h);
  const d = cx.getImageData(0,0,w,h).data;
  const lum = new Float32Array(w*h);

    const l = (0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2])/255;

}

   // рваные ленты, а при отборе по площади они и вовсе пропадали — картинка
   // с тёмным краем давала ноль контуров.
  const at = (x, y) => {
    if(x < -0.5 || y < -0.5 || x > w-0.5 || y > h-0.5) return 1;
    const xi = clamp(x, 0, w-1.001), yi = clamp(y, 0, h-1.001);
    const x0 = Math.floor(xi), y0 = Math.floor(yi), fx = xi-x0, fy = yi-y0;
    const g = (a,c) => lum[c*w + a];
    const v = g(x0,y0)*(1-fx)*(1-fy) + g(x0+1,y0)*fx*(1-fy) +
              g(x0,y0+1)*(1-fx)*fy   + g(x0+1,y0+1)*fx*fy;
    return clamp((v - 0.5)*k + 0.5 + b, 0, 1);

    for(let dy=-r; dy<=r; dy+=r) for(let dx=-r; dx<=r; dx+=r){ s += at(x+dx, y+dy); n++; }

function rdpOpen(pts, eps){
  if(pts.length < 4) return pts;
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length-1] = 1;
  const stack = [[0, pts.length-1]];
  while(stack.length){
    const [a, b] = stack.pop();
    if(b - a < 2) continue;
    const A = pts[a], B = pts[b];
    const dx = B[0]-A[0], dy = B[1]-A[1], L = Math.hypot(dx,dy) || 1;
    let best = -1, bd = eps;
    for(let i=a+1;i<b;i++){
      const d = Math.abs((pts[i][0]-A[0])*dy - (pts[i][1]-A[1])*dx)/L;
      if(d > bd){ bd = d; best = i; }
    }
    if(best > 0){ keep[best] = 1; stack.push([a,best],[best,b]); }
  }
  return pts.filter((_,i) => keep[i]);

/* На ЗАМКНУТОМ контуре обычный RDP вырождается: первая и последняя точки
   совпадают, базовый отрезок нулевой длины, все отклонения выходят нулевыми
   и от кольца остаются две точки. Поэтому кольцо сначала делится самой
   дальней от начала точкой на две дуги, и каждая упрощается отдельно. */
function rdp(pts, eps){
  if(pts.length < 8) return pts;

  for(let i=1;i<pts.length;i++){
    const d = Math.hypot(pts[i][0]-pts[0][0], pts[i][1]-pts[0][1]);
    if(d > fd){ fd = d; far = i; }
  }
  if(far < 2 || far > pts.length-2) return rdpOpen(pts, eps);
  const a = rdpOpen(pts.slice(0, far+1), eps);
  const b = rdpOpen(pts.slice(far), eps);
  return a.concat(b.slice(1, Math.max(1, b.length-1)));
}
function picTrace(){
  if(!IMGC.img){ IMGC.loops = null; IMGC.pts = 0; return; }
  const S = picSampler(IMGC.img, 190);
  const f0 = picField(S);
  const f = IMGC.invert ? ((x,y) => -f0(x,y)) : f0;
  // Поле берётся с запасом за краями кадра, чтобы любая фигура замкнулась.
  const M = 3;
  let rings = marchingSquares(f, {x0:-M, y0:-M, x1:S.w-1+M, y1:S.h-1+M},
                              Math.max(S.w, S.h) + 2*M);
  const big = Math.max(1, (S.w*S.h) * IMGC.minArea/100);
  rings = rings.filter(r => polyArea(r) >= big);
  // упрощаем, пока не уложимся в предел по точкам
  let eps = 0.35;
  for(let i=0;i<12;i++){
    const simp = rings.map(r => rdp(r, eps)).filter(r => r.length > 3);
    const n = simp.reduce((a,r) => a + r.length, 0);
    if(n <= PIC_MAX_PTS || eps > 8){ rings = simp; break; }
    eps *= 1.45;
  }
  if(!rings.length){ IMGC.loops = null; IMGC.pts = 0; return; }
  // нормализуем в квадрат 1x1 с центром в нуле — как встроенные иконки
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const r of rings) for(const p of r){
    if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0];
    if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  const sc = 1/Math.max(x1-x0, y1-y0, 1e-6), mx = (x0+x1)/2, my = (y0+y1)/2;
  IMGC.loops = rings.map(r => r.map(p => [ (p[0]-mx)*sc, -(p[1]-my)*sc ]));
  IMGC.pts = IMGC.loops.reduce((a,r) => a + r.length, 0);
}
function picPreview(){
  const box = document.getElementById("picPrev");

  // Исходник показывается бледной подложкой под контуром: иначе не понять,
  // что именно делает порог — видно только результат, и любое движение
  // ползунка выглядит как непредсказуемые пятна.

/* Расчёт STL включается только в сборке для своего домена: в песочнице
   артефакта скачивание файлов заблокировано, а движок весом в тринадцать
   мегабайт туда всё равно не положить. */
const STL_ENABLED = true;
/* ===================== расчёт STL прямо в браузере =====================
   На своём домене нет песочницы артефакта, поэтому файл можно просто отдать
   на скачивание. Геометрию считает настоящий OpenSCAD, собранный под
   WebAssembly, — та же программа, что на компьютере. Сверено с нативной
   сборкой: одна и та же деталь даёт совпадающий объём с точностью до
   округления чисел в STL.

   Считает он втрое медленнее нативного: половинка — секунд двадцать, обе —
   около минуты. Поэтому расчёт уходит в отдельный поток, а рядом есть выбор,
   что считать: только крышку (быстро, посмотреть) или всё для печати. */
let stlWorker = null, stlSeq = 0, stlBusy = false;
function stlLog(msg, kind){
  const el = document.getElementById("stlNote");
  if(!el) return;
  el.textContent = msg;
  el.className = "note" + (kind === "warn" ? " w" : "");
}
function saveBlob(name, data, mime){
  const b = new Blob([data], {type: mime || "application/octet-stream"});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function buildStl(part, en){
  if(stlBusy) return;
  if(!stlWorker){
    stlWorker = new Worker("vendor/openscad/worker.js", {type:"module"});
    stlWorker.onmessage = ev => {
      const d = ev.data;
      if(d.type === "stage")
        stlLog(T_(d.stage === "boot" ? "stl_boot" : "stl_run"));
      else if(d.type === "log") console.warn("OpenSCAD:", d.text);
      else if(d.type === "done"){
        stlBusy = false; setStlBusy(false);
        const mb = (d.stl.length/1048576).toFixed(1);
        stlLog(T_("stl_ok", (d.ms/1000).toFixed(0), mb));
        saveBlob(stlName(d.part), d.stl, "model/stl");
      } else if(d.type === "error"){
        stlBusy = false; setStlBusy(false);
        stlLog(T_("stl_err") + " " + d.message, "warn");
      }
    };
    stlWorker.onerror = e => {
      stlBusy = false; setStlBusy(false);
      stlLog(T_("stl_err") + " " + (e.message || ""), "warn");
    };
  }
  stlBusy = true; setStlBusy(true);
  stlLog(T_("stl_boot"));
  lastStlPart = part;
  stlWorker.postMessage({id: ++stlSeq, scad: buildScad(part, !!en), part});
}
let lastStlPart = "print";
const stlName = () => ({print:"coin_case_print", part1:"coin_case_lid",
                        part2:"coin_case_base"})[lastStlPart] + ".stl";

  for(const b of document.querySelectorAll("[data-stl]")) b.disabled = on;
}
